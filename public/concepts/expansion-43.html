const expanded=new Set();let selected=null,choice='',saved=false,plan=0,editorDraft=draft;const btn=(label,id,cls='row')=>`<button class="${cls}" id="${id}">${label}</button>`,back=btn('‹ Back','back','back'),heading=t=>`<h1>${t}</h1>`,copy=t=>`<p class="reader-copy">${t}</p>`,wrap=t=>`<div class="content">${t}</div>`,entry=(title,text,i)=>`<button class="row ledger" data-open="${i}"><h2>${title}</h2><span class="fine">${text}</span></button>`,disclose=(title,text,i)=>`<details data-section="${i}" class="section"><summary>${title}</summary>${text}</details>`,choices=()=>['Yes','Not quite','Not yet'].map((x,i)=>`<button data-choice="${i}" class="choice" aria-pressed="${choice===String(i)}"><i></i>${x}</button>`).join(''),save=()=>`<p id="status" class="fine gold">${saved?'Saved in this prototype.':choice?'Not saved yet.':'Choose an outcome.'}</p><button class="primary" id="save" ${!choice||saved?'disabled':''}>${saved?'Saved':'Save outcome'}</button>`,claim=()=>`<p>${forecast}</p><p class="fine">${qualifier}</p>`,planBody=i=>`<p class="compact-price">${plans[i][1]}</p><p class="fine">${plans[i][2]}</p>`,commonPlans=()=>`<p class="fine">${terms}</p><button class="primary" id="buy">Simulate ${plans[plan][0].toLowerCase()} Plus</button><details><summary>One-time reading packs</summary><p>5 readings · $1.99<br>20 readings · $5.99</p><p class="fine">Never expire. No renewal. Simulated credits only.</p></details><p class="fine">Failed forecasts use no reading. Restore purchases is available in the app.</p>`;
function render(){let body='',trade='';
if(scene==='history'){trade=['Compact ledger: compare dates/outcomes before opening full content; adds a detail step.','Expandable journal: full entries stay in context; open records spread the list.','Record picker: only one record occupies the screen; other entries live in the menu.'][['a','b','c'].indexOf(v)];if(v==='a')body=selected===null?heading('History')+'<p class="fine">Saved on this device</p>'+records.map((r,i)=>entry(r[0],r[2],i)).join(''):back+heading(records[selected][0])+copy(records[selected][1])+copy(records[selected][2])+btn('Record outcome','open-task','primary');if(v==='b')body=heading('History')+records.map((r,i)=>disclose(r[0]+' · '+r[2],copy(r[1])+btn('Record outcome','record-'+i),i)).join('');if(v==='c'){selected=selected??0;body=heading('History')+`<select class="picker" id="pick">${records.map((r,i)=>`<option value="${i}" ${i===selected?'selected':''}>${r[0]}</option>`)}</select>`+copy(records[selected][2])+copy(records[selected][1])+btn('Record outcome','open-task','primary')}}
if(scene==='checkin'){trade=['Compact claim and inline outcome: exact context stays beside choices; large text scrolls.','Outcome-first: choices appear sooner with full claim in a disclosure; requires opening context.','Outcome sheet: full claim scrolls with choices and Save stays below; the footer reduces reading space.'][['a','b','c'].indexOf(v)];if(v==='a')body=back+heading('What happened?')+claim()+choices()+save()+disclose('Original question',copy(question),0);if(v==='b')body=back+heading('What happened?')+disclose('Read the forecast',claim()+copy(question),0)+choices()+save();if(v==='c'){body=back+heading('Check-in')+claim()+btn('Record outcome','open-task','primary');if(selected!==null)body=`<div class="sheet">${wrap(back+heading('What happened?')+claim()+choices())}<div class="footer">${save()}</div></div>`}}
if(scene==='evidence'){trade=['Indexed reading: jump within complete content; long text still needs scrolling.','Single-open sections: scan choices then read in place; long answers separate section controls.','Focused reader: previous/next keeps one section in view; overview is behind a selector.'][['a','b','c'].indexOf(v)];if(v==='a')body=heading('Reading details')+`<nav>${evidence.map((r,i)=>`<a href="#part-${i}">${r[0]} ↓</a>`).join('')}</nav>`+evidence.map((r,i)=>`<section id="part-${i}">${heading(r[0])+copy(r[1])}<a href="#phone">Back to index ↑</a></section>`).join('');if(v==='b')body=heading('Reading details')+evidence.map((r,i)=>disclose(r[0],copy(r[1]),i)).join('');if(v==='c'){selected=selected??0;body=`<select class="picker" id="pick">${evidence.map((r,i)=>`<option value="${i}" ${i===selected?'selected':''}>${r[0]}</option>`)}</select>`+heading(evidence[selected][0])+copy(evidence[selected][1])+`<div class="command">${btn('‹ Previous','previous')}${btn('Next ›','next')}</div>`}}
if(scene==='editor'){trade=['Open writing area: no nested frame, the draft is the page; the input boundary is subtle.','One inset field: familiar editable boundary and commands in the scroll flow; uses more frame space.','Writing sheet: separate persistent commands; less draft fits above the footer.'][['a','b','c'].indexOf(v)];const field=`<textarea aria-label="Your question" class="${v==='a'?'open-editor':''}" maxlength="500">${editorDraft}</textarea><p class="fine" id="capacity">${editorDraft.length} of 500 characters</p>`;body=back+heading('Your question')+field+btn('Done','editor-done','primary');if(v==='c')body=`<div class="sheet">${wrap(heading('Your question')+field)}<div class="footer command">${btn('Cancel','back')}${btn('Done','editor-done','primary')}</div></div>`}
if(scene==='plans'){trade=['Compact price ledger: all prices compare directly with common terms; secondary benefits sit below.','Selected offer: short choice plus full selected terms; comparing needs switching.','Expandable offers: inspect billing inline; expanded content increases scroll.'][['a','b','c'].indexOf(v)];body=heading('Choose your next chapter')+'<p class="fine gold">Test mode · no real payments</p><p>Plus · 10 readings a day</p><p class="fine">Deeper Why, ball and card styles, unlimited seals.</p>';if(v==='a')body+=plans.map((r,i)=>`<button class="row" data-plan="${i}" aria-pressed="${i===plan}">${i===plan?'✓ ':''}${r[0]}<span class="compact-price">${r[1]}</span><span class="fine">${r[2]}</span></button>`).join('');if(v==='b')body+=`<select class="picker" id="pick">${plans.map((r,i)=>`<option value="${i}" ${i===plan?'selected':''}>${r[0]} · ${r[1]}</option>`)}</select>`+planBody(plan);if(v==='c')body+=plans.map((r,i)=>disclose(r[0]+' · '+r[1],planBody(i)+`<button class="row" data-plan="${i}">${i===plan?'Selected':'Choose '+r[0]}</button>`,i)).join('');body+=commonPlans()}
if(scene==='circle'){trade=['Circle overview: distinct destinations keep the group readable; details require opening.','Task selector: focused people/forecast/activity views; some group context is hidden.','Circle sections: one open group at a time; longer content moves the remaining controls.'][['a','b','c'].indexOf(v)];body=heading('Your little circle')+'<p class="fine">Rowan · @rowan<br>Circle 1 · 2 of 20 people</p>';if(v==='a')body+=selected===null?circle.map((r,i)=>entry(r[0],i===0?'You and Alex':i===1?'One shared forecast':'Latest moments',i)).join(''):back+heading(circle[selected][0])+copy(circle[selected][1]);if(v==='b'){selected=selected??0;body+=`<select class="picker" id="pick">${circle.map((r,i)=>`<option value="${i}" ${i===selected?'selected':''}>${r[0]}</option>`)}</select>`+copy(circle[selected][1])}if(v==='c')body+=circle.map((r,i)=>disclose(r[0],copy(r[1]),i)).join('');body+=disclose('Circle controls','<p>Invite a friend · manage members · leave Circle.</p><p>These actions are labels in this visual comparison; no request is sent.</p>',9)}
phone.innerHTML=body.includes('class="sheet"')?body:wrap(body);document.querySelector('#tradeoff').textContent=trade;document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.open);render()});document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{plan=Number(b.dataset.plan);render()});document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{choice=b.dataset.choice;saved=false;render()});for(const id of ['back'])if(document.querySelector('#'+id))document.querySelector('#'+id).onclick=()=>{selected=null;render()};if(document.querySelector('#open-task'))document.querySelector('#open-task').onclick=()=>{selected=0;render()};if(document.querySelector('#pick'))document.querySelector('#pick').onchange=e=>{if(scene==='plans')plan=Number(e.target.value);else selected=Number(e.target.value);render()};if(document.querySelector('#save'))document.querySelector('#save').onclick=()=>{saved=true;render()};for(const [id,d] of [['previous',-1],['next',1]])if(document.querySelector('#'+id))document.querySelector('#'+id).onclick=()=>{selected=(selected+d+evidence.length)%evidence.length;render()};document.querySelectorAll('details').forEach((d,i)=>{const key=d.dataset.section??'extra-'+i;d.open=expanded.has(key);d.querySelector('summary').onclick=e=>{e.preventDefault();const opening=!expanded.has(key);if((v==='b'&&scene==='evidence')||(v==='c'&&scene==='circle'))expanded.clear();if(opening)expanded.add(key);else expanded.delete(key);render()}});document.querySelectorAll('a[href="#phone"]').forEach(a=>a.onclick=e=>{e.preventDefault();phone.querySelector('.content').scrollTop=0});if(document.querySelector('textarea'))document.querySelector('textarea').oninput=e=>{editorDraft=e.target.value;document.querySelector('#capacity').textContent=editorDraft.length+' of 500 characters'};if(document.querySelector('#editor-done'))document.querySelector('#editor-done').onclick=()=>{document.querySelector('#capacity').textContent='Draft retained in this prototype.'};}
render();

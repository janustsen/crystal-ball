</style><aside><h1>Room for the question</h1><p>Throwaway task layouts. Same selected fonts and Open mist. No reading, birthday validation, age decision or check-in is saved.</p><div class="controls"><select id="scene"><option value="question">Follow-up question</option><option value="custom">Custom answer</option><option value="birthday">Optional birthday</option><option value="checkin">Check-in</option></select><button data-variant="a">A</button><button data-variant="b">B</button><button data-variant="c">C</button><button id="large">200% text</button><button id="short">500px viewport</button><button id="reset">Reset</button></div><p id="tradeoff"></p></aside><main class="phone"><header class="header"></header><section class="content"></section><footer class="nav" style="display:none"></footer></main><script type="module">
const params=new URLSearchParams(location.search),art=await fetch('study-assets/orb.json').then(r=>r.json());let scene=params.get('scene')||'question',variant=params.get('variant')||'a',large=params.get('large')==='1',short=params.get('short')==='1',step=0;const phone=document.querySelector('.phone'),content=document.querySelector('.content');if(params.has('capture'))document.body.classList.add('capture');
const descriptions={question:{a:'A · Compact editorial: progress above a smaller serif question, direct answer rows. More content together; leaves the large utility orb behind.',b:'B · Select then continue: radio selection stays visible until explicit Continue. More control and correction time; one extra tap per question.',c:'C · Orb medallion: small illustrated progress mark and centered question, then direct answers. Keeps ritual continuity; consumes more vertical space than A.'},custom:{a:'A · One scrolling task: separate back-to-choices row, progress and question above the input. Clear sequence; navigation can scroll out of view.',b:'B · Answer review: write, then inspect your answer before continuing. Explicit commitment; an added review step.',c:'C · Compact question receipt: small orb beside progress, question in body type and direct answer. Less heading competition; reduced serif emphasis.'},birthday:{a:'A · Compact date grid: day/month/year together, two rows at200%, Skip beside optionality. Familiar labeled parts; form order changes responsively.',b:'B · One date field: explicit YYYY-MM-DD with an example and separate Skip. Compact at200%; format burden and validation must be proven.',c:'C · One date part at a time: day, month, year with Back and Skip. Focused fields; three steps and draft preservation required.'},checkin:{a:'A · Compact context first: original question, optional forecast, then immediate outcomes. Familiar one-step save; expansion can still lengthen the task.',b:'B · Outcome first with explicit save: radio choice, Save outcome, and forecast disclosure afterward. Task stays near top; full context sits below and save adds a step.',c:'C · Review then record: full forecast context precedes a separate outcome step with a return route. Clear task phases; adds navigation.'}};
const question='How much of your plan have you prepared?',original='Will I be conversational in Spanish in six months?',forecast='By spring you will hold a twenty-minute conversation in Spanish',choices=['Barely started','Halfway there','Nearly ready','In my own words'],outcomes=['Came true','Did not happen','Still waiting'];
const back='<button class="back" id="back">‹ Back</button>',progress='<span class="progress">1 of 2</span>',top='<div class="topline">'+back+progress+'</div>',medal='<div class="medallion">'+art+'<span class="progress">One more detail<br>1 of 2</span></div>';
function options(items,radio=false){return '<div class="answers">'+items.map((t,i)=>'<button class="choice" data-choice="'+i+'" aria-pressed="false">'+(radio?'<i aria-hidden="true"></i>':'')+'<span>'+t+'</span></button>').join('')+'</div>';}
function evidence(){return '<details class="details" id="forecast"><summary>Read the saved forecast</summary><div class="result"><p class="question-anchor">'+forecast+'</p><p class="caption gold">Speculative forecast · not a guarantee</p></div></details>';}
function finish(message){content.innerHTML='<h1 class="task-title">'+message+'</h1><p class="caption">Prototype only. Nothing was sent or saved.</p><button class="quiet" id="again">Back to comparison</button>';document.querySelector('#again').onclick=render;}
function render(){phone.className='phone'+(large?' large':'')+(short?' short':'');phone.style.height=params.has('capture')?'100vh':short?'500px':'844px';document.querySelector('#scene').value=scene;document.querySelector('#large').setAttribute('aria-pressed',large);document.querySelector('#short').setAttribute('aria-pressed',short);document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.variant===variant));document.querySelector('#tradeoff').textContent=descriptions[scene][variant];content.innerHTML='';
if(scene==='question'){
 content.innerHTML=(variant==='c'?back+medal:top)+'<h1 class="task-title '+(variant==='c'?'centered':'')+'">'+question+'</h1><p class="intro">'+(variant==='b'?'Choose one, then continue.':'Choose an answer to continue.')+'</p>'+options(choices,variant==='b')+(variant==='b'?'<button class="primary" id="continue" disabled>Continue</button>':'');
 content.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(b.dataset.choice==='3'){scene='custom';render();return}content.querySelectorAll('[data-choice]').forEach(x=>x.setAttribute('aria-pressed',x===b));if(variant==='b'){document.querySelector('#continue').disabled=false;document.querySelector('#continue').onclick=()=>finish('Answer selected')}else finish('Next question')});
}else if(scene==='custom'){
 content.innerHTML=(variant==='c'?back+medal:top)+'<button class="quiet inline-back" id="choices">‹ Back to choices</button><h1 class="task-title '+(variant==='c'?'card-small':'')+'">'+question+'</h1><label class="field" for="answer">Your answer</label><textarea id="answer">I have time set aside each week and a friend who can help.</textarea><button class="primary" id="continue">'+(variant==='b'?'Review answer':'Continue')+'</button>';
 document.querySelector('#choices').onclick=()=>{scene='question';render()};document.querySelector('#continue').onclick=()=>{if(variant==='b'){const value=document.querySelector('#answer').value;content.innerHTML=top+'<h1 class="task-title">Your answer</h1><p class="question-anchor" id="review"></p><button class="primary" id="confirm">Use this answer</button><button class="quiet" id="edit">Edit answer</button>';document.querySelector('#review').textContent=value;document.querySelector('#confirm').onclick=()=>finish('Answer selected');document.querySelector('#edit').onclick=render;}else finish('Answer selected')};
}else if(scene==='birthday'){
 content.innerHTML='<p class="compact-label">A little about you · 1 of 2</p><h1 class="task-title">Your birthday</h1><p class="intro">Optional. Used for your Sun sign and age-appropriate readings.</p><button class="quiet quiet-top" id="skip">Skip birthday</button>';
 if(variant==='a')content.innerHTML+='<div class="date-grid"><label><span class="field">Day</span><input type="text" inputmode="numeric" placeholder="DD" aria-label="Day"></label><label><span class="field">Month</span><input type="text" inputmode="numeric" placeholder="MM" aria-label="Month"></label><label class="year"><span class="field">Year</span><input type="text" inputmode="numeric" placeholder="YYYY" aria-label="Year"></label></div><button class="primary" id="continue">Continue</button>';
 if(variant==='b')content.innerHTML+='<label class="field" for="date">Year–month–day</label><input id="date" type="text" placeholder="YYYY-MM-DD"><p class="caption">For example, 1995-06-15.</p><button class="primary" id="continue">Continue</button>';
 if(variant==='c'){const part=['Day','Month','Year'][step];content.innerHTML+='<p class="progress">Date part '+(step+1)+' of 3</p><label class="field" for="date">'+part+'</label><input id="date" type="text" inputmode="numeric" placeholder="'+['DD','MM','YYYY'][step]+'"><button class="primary" id="continue">'+(step===2?'Continue':'Next: '+['month','year'][step])+'</button>'+(step?'<button class="quiet" id="previous">Previous part</button>':'');document.querySelector('#previous')?.addEventListener('click',()=>{step--;render()});}
 document.querySelector('#skip').onclick=()=>finish('Age confirmation comes next');document.querySelector('#continue').onclick=()=>{if(variant==='c'&&step<2){step++;render()}else finish('Birthday review — prototype only')};
}else{
 if(variant==='c'&&step===0){content.innerHTML=back+'<p class="compact-label">Check-in · review</p><h1 class="task-title">'+original+'</h1><p class="question-anchor">'+forecast+'</p><p class="caption gold">Speculative forecast · not a guarantee</p><button class="primary" id="record">Record an outcome</button>';document.querySelector('#record').onclick=()=>{step=1;render()};}
 else{content.innerHTML=back+'<p class="compact-label">Check-in</p><h1 class="task-title">What happened?</h1><p class="question-anchor">'+original+'</p>'+(variant==='a'?evidence():'')+options(outcomes,variant==='b')+(variant==='b'?'<button class="primary" id="save" disabled>Save outcome</button>'+evidence():variant==='c'?'<button class="quiet" id="review-forecast">Review forecast again</button>':'')+'<p class="page-footnote">Your outcome stays on this device. You can change it later.</p>';document.querySelector('#review-forecast')?.addEventListener('click',()=>{step=0;render()});content.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{content.querySelectorAll('[data-choice]').forEach(x=>x.setAttribute('aria-pressed',x===b));if(variant==='b'){document.querySelector('#save').disabled=false;document.querySelector('#save').onclick=()=>finish('Outcome selected')}else finish('Outcome selected')});}
}document.querySelector('#back')?.addEventListener('click',()=>{step=0;render()});content.scrollTop=0;}
document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>{variant=b.dataset.variant;step=0;render()});document.querySelector('#scene').onchange=e=>{scene=e.target.value;step=0;render()};document.querySelector('#large').onclick=()=>{large=!large;render()};document.querySelector('#short').onclick=()=>{short=!short;render()};document.querySelector('#reset').onclick=()=>{step=0;render()};render();
</script></html>

height:48px;border:0;border-bottom:1px solid #614c3466;border-radius:0;padding:12px 0;color:#f2c284;text-align:left}.field{display:block;margin:12px 0 6px;font-size:.875em;color:#b9ab97}input[type=text]{display:block;width:100%;min-height:56px;padding:14px 12px;border:1px solid #79634a;border-radius:12px;background:transparent}.decision{display:flex;gap:12px;align-items:center;padding:12px 0;min-height:52px}.decision input{width:24px;height:24px;flex-shrink:0;accent-color:#e0a458}.rule{border-bottom:1px solid #614c3466;padding:14px 0}.receipt{margin:14px 0}.receipt .row{padding:12px 0;border-bottom:1px solid #614c3466}.receipt dt{font-size:.875em;color:#e0a458;margin-bottom:4px}.receipt dd{margin:0}.sticky{flex-shrink:0;padding:12px 24px 24px;background:#100c09;border-top:1px solid #614c3466}.sticky .primary{margin-top:8px}.home .orb{--s:261px;width:261px;height:261px;margin:20px auto 53px}.orb .gb,.orb .pool,.orb .halo,.orb::before{animation:none!important}.large .home{padding-top:0;padding-bottom:8px}.large .home .orb{margin:0 auto 41px}.invitation{text-align:center;margin:0}.disclaimer{text-align:center;font-size:.75em;line-height:1.5;margin:8px 0}.omen{margin-top:16px;padding-top:8px;border-top:1px solid #614c3466}.large .omen{margin-top:8px}.omen p{margin:8px 0 0}.omen .caption{margin-top:4px}.timeline{display:grid;grid-template-columns:1fr 1fr;gap:16px;border-top:1px solid #79634a;padding-top:12px;margin-top:16px}.timeline .caption{font-size:.75em}.timeline .day{position:relative;padding-bottom:12px}.timeline .day:before{content:'';position:absolute;left:0;top:-16px;width:7px;height:7px;border-radius:50%;background:#e0a458}.nav{display:flex;align-items:flex-end;justify-content:space-between;gap:4px;min-height:106px;padding:16px 10px 20px;border-top:1px solid #614c3466;flex-shrink:0}.large .nav{min-height:128px}.nav span{font-size:.75em}.nav .selected{color:#e0a458}.nav>span{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;m </style><aside><h1>Clear decisions, closer actions</h1><p>Throwaway Open mist studies. Same selected fonts and text scaling. No consent, model, storage or chart operations occur here.</p><div class="controls"><select id="scene"><option value="omen">Unavailable omen</option><option value="consent">AI permission</option><option value="birth">Birth details</option></select><button data-variant="a">A</button><button data-variant="b">B</button><button data-variant="c">C</button><button id="large">200% text</button><button id="reset">Reset</button><button id="saved">Saved result</button></div><p id="tradeoff"></p></aside><main class="phone"><header class="header"></header><section class="content"></section><div id="decision"></div><footer class="nav"></footer></main><script type="module">
const params=new URLSearchParams(location.search),art=await fetch('study-assets/orb.json').then(r=>r.json()),tabs=await fetch('study-assets/tabs.json').then(r=>r.json());let scene=params.get('scene')||'omen',variant=params.get('variant')||'a',large=params.get('large')==='1',stage=params.get('state')||'initial';const content=document.querySelector('.content'),header=document.querySelector('.header'),footer=document.querySelector('.nav'),decision=document.querySelector('#decision');if(params.has('capture'))document.body.classList.add('capture');
const explanations={omen:{a:'A · Explicit inline status: no omen, today’s attempt used, next attempt tomorrow. Everything visible; more status text beneath the hero.',b:'B · Quiet status disclosure: keep Home short, reveal attempt and schedule details on request. Less visual weight; one tap to understand the limit.',c:'C · Daily timeline: separate today’s used attempt from tomorrow’s next opportunity. Distinct state model; more vertical structure.'},consent:{a:'A · Allow and return: full disclosure with one explicit permission action; returns to composing, never sends. Fewer steps, no persistent checkbox on this screen.',b:'B · Persistent decision: full disclosure scrolls above a fixed switch and return action. Controls stay reachable; less space for enlarged disclosure.',c:'C · Data receipt: short labeled rows explain inputs and purposes before a switch and return. Easy scanning; a longer structured list.'},birth:{a:'A · Focused full-screen form: time and city together, no global tabs until Done. Fewer competing controls; temporarily leaves You navigation.',b:'B · One detail at a time: time, then city, then saved result. A focused next action; more steps and draft-return work.',c:'C · Editable summary: keep You context, open one field from a review list. Overview stays compact; more taps to fill both values.'}};
const disclosure='<p class="caption">With permission, Test provider processes your questions, relevant answers and saved headlines for readings, omens and sharing checks.</p><p class="caption">Friend readings also use their sun sign and shared themes. Avoid sensitive details.</p>';
const permission='<label class="decision"><input type="checkbox" id="allow">Allow AI processing</label>';
const notice='<p class="caption">Permission only. Your question is sent after you return and tap Ask.</p>';
function bindStudy(){content.querySelectorAll('[data-study]').forEach(b=>b.onclick=()=>{content.innerHTML='<h1>Question retained</h1><p>Will I start learning pottery this winter?</p><p class="study-note">Prototype only. Nothing was allowed, stored or sent.</p><button class="quiet" id="again">Back to study</button>';content.querySelector('#again').onclick=render;decision.innerHTML='';content.scrollTop=0;});}
function render(){document.querySelector('.phone').classList.toggle('large',large);document.querySelector('#scene').value=scene;document.querySelector('#large').setAttribute('aria-pressed',large);document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.variant===variant));document.querySelector('#tradeoff').textContent=explanations[scene][variant];content.className='content';decision.innerHTML='';decision.className='';footer.style.display=scene==='omen'||scene==='birth'&&variant==='c'?'flex':'none';footer.innerHTML=['Home','Sky','Ask','History','You'].map(name=>'<span class="'+(name===(scene==='omen'?'Home':'You')?'selected':'')+'">'+(name==='Ask'?art:tabs[name==='Sky'?'Explore':name].replaceAll('currentColor',name===(scene==='omen'?'Home':'You')?'#e0a458':'#b9ab97'))+'<span>'+name+'</span></span>').join('');header.innerHTML=scene==='omen'?'<span class="brand">Crystal Ball</span><span class="balance">1 reading'+(large?'<br>':' ')+'left</span>':scene==='birth'&&variant==='c'?'<span class="page-name">You</span><span class="balance">1 reading'+(large?'<br>':' ')+'left</span>':'<button class="back" id="back">‹ '+(scene==='birth'?'You':'Question')+'</button>';header.querySelector('#back')?.addEventListener('click',()=>{stage='initial';render()});
 if(scene==='omen'){
 content.classList.add('home');content.innerHTML=art+'<p class="invitation">Touch the ball.</p><p class="disclaimer">For fun. Not a guarantee.</p><div class="omen"><div class="caption gold home-label">Today’s omen · free</div><div id="omen-status"></div></div>';const target=content.querySelector('#omen-status');
 if(variant==='a')target.innerHTML='<p>No omen available.</p><p class="caption">Today’s attempt is used.<br>Next attempt: tomorrow.</p>';
 if(variant==='b'){target.innerHTML='<button class="quiet" id="status" aria-expanded="false">Omen unavailable ⌄</button><div id="status-detail"></div>';content.querySelector('#status').onclick=e=>{const open=e.currentTarget.getAttribute('aria-expanded')!=='true';e.currentTarget.setAttribute('aria-expanded',open);content.querySelector('#status-detail').innerHTML=open?'<p class="caption">Today’s attempt is used. Your next attempt is tomorrow.</p>':'';};if(stage==='expanded')content.querySelector('#status').click();}
 if(variant==='c')target.innerHTML='<div class="timeline"><div class="day"><div class="caption">Today</div><div>No omen</div><div class="caption">Attempt used</div></div><div class="day"><div class="gold">Tomorrow</div><div class="caption">Next attempt</div></div></div>';
 }else if(scene==='consent'){
 content.innerHTML='<h1>AI permission</h1>';
 if(variant==='a')content.innerHTML+=disclosure+notice+'<button class="primary" data-study>Allow and return</button><button class="quiet" data-study>Not now</button>';
 if(variant==='b'){content.innerHTML+=disclosure+notice;decision.className='sticky';decision.innerHTML=permission+'<button class="primary" id="return">Return to question</button>';decision.querySelector('#return').onclick=()=>{decision.innerHTML='';decision.className='';content.innerHTML='<h1>Question retained</h1><p class="study-note">Prototype only. No permission recorded or request sent.</p>';};}
 else decision.className='';
 if(variant==='c')content.innerHTML+='<p class="caption">Provider: Test provider</p><dl class="receipt"><div class="row"><dt>Your input</dt><dd>Questions and relevant answers</dd></div><div class="row"><dt>Saved context</dt><dd>Saved headlines</dd></div><div class="row"><dt>Friend readings</dt><dd>Their sun sign and shared themes</dd></div><div class="row"><dt>Used for</dt><dd>Readings, omens and sharing checks</dd></div></dl><p class="caption">Avoid sensitive details.</p>'+permission+notice+'<button class="primary" data-study>Return to question</button>';
 bindStudy();
 }else{
 decision.className='';content.classList.add('tight');
 if(stage==='saved'){content.classList.add('completion');content.innerHTML='<p class="caption gold">Calculated and saved</p><h1>Your Moon and rising</h1><p>Capricorn Moon<br>Libra rising</p><button class="primary" id="done">Done</button>'+(variant==='c'?'<button class="quiet" id="details">Saved details ⌄</button><div id="saved-details"></div>':'<p class="caption">Copenhagen, Denmark · 14:30</p><button class="quiet" id="edit">Edit details</button>');content.querySelector('#done').onclick=()=>{content.innerHTML='<h1>Your sky</h1><p class="study-note">Prototype complete. No chart was calculated or stored.</p>'};content.querySelector('#edit')?.addEventListener('click',()=>{stage='initial';render()});content.querySelector('#details')?.addEventListener('click',()=>content.querySelector('#saved-details').innerHTML='<p class="caption">Copenhagen, Denmark · 14:30</p>');}
 else if(variant==='a'){content.innerHTML='<h1>Birth details</h1><p class="caption">Optional · Moon and rising signs</p><label class="field" for="time">Birth time · 24-hour</label><input id="time" type="text" placeholder="HH:MM"><p class="caption">For example, 14:30.</p><label class="field" for="city">Birth city</label><input id="city" type="text" placeholder="City, country"><button class="quiet" id="find">Find city</button><div id="city-result"></div><button class="primary" id="calculate" disabled>Calculate and save</button><p class="caption">City search: Open-Meteo / GeoNames. Only the city name is sent.</p>';content.querySelector('#find').onclick=()=>{content.querySelector('#city-result').innerHTML='<button class="quiet" id="choose">Copenhagen, Denmark</button>';content.querySelector('#choose').onclick=()=>{content.querySelector('#city-result').innerHTML='<p class="caption gold">Selected: Copenhagen, Denmark</p>';content.querySelector('#calculate').disabled=false;}};content.querySelector('#calculate').onclick=()=>{stage='saved';render()};}
 else if(variant==='b'){const city=stage.startsWith('city');content.innerHTML='<p class="steps">Birth details · '+(city?'2':'1')+' of 2</p><h1>'+ (city?'Your birth city':'Your birth time')+'</h1><p class="caption">'+(city?'Choose the place where you were born.':'Use your local time on a 24-hour clock.')+'</p><label class="field" for="detail">'+(city?'City, country':'Time · for example 14:30')+'</label><input id="detail" type="text" placeholder="'+(city?'Copenhagen, Denmark':'HH:MM')+'"><button class="primary" id="next">'+(city?'Find city':'Next: city')+'</button><p class="caption">'+(city?'Only the city name is sent to Open-Meteo / GeoNames.':'Optional · used for your Moon and rising signs.')+'</p>';content.querySelector('#next').onclick=()=>{if(city){content.querySelector('#next').outerHTML='<button class="quiet" id="selected-city">Copenhagen, Denmark</button><button class="primary" id="save-chart">Calculate and save</button>';content.querySelector('#save-chart').onclick=()=>{stage='saved';render()};}else{stage='city';render()}};}
 else{content.innerHTML='<h1>Birth details</h1><p class="caption">Optional · Moon and rising signs</p><div class="details-summary rule"><div><div class="caption">Time</div><div>Not set</div></div><button class="quiet" id="edit-time">Add ›</button></div><div class="details-summary rule"><div><div class="caption">City</div><div>Not set</div></div><button class="quiet" id="edit-city">Add ›</button></div><button class="primary" disabled>Calculate and save</button>';for(const id of ['time','city'])content.querySelector('#edit-'+id).onclick=()=>{content.innerHTML='<h1>'+ (id==='time'?'Birth time':'Birth city')+'</h1><label class="field" for="detail">'+(id==='time'?'Local time · 24-hour':'City, country')+'</label><input id="detail" type="text" placeholder="'+(id==='time'?'HH:MM':'Copenhagen')+'"><button class="primary" id="keep">Return to details</button><p class="caption">Prototype only; no input is saved.</p>';content.querySelector('#keep').onclick=render;};}
 }
 content.scrollTop=0;
}
document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>{variant=b.dataset.variant;stage='initial';render()});document.querySelector('#scene').onchange=e=>{scene=e.target.value;stage='initial';render()};document.querySelector('#large').onclick=()=>{large=!large;render()};document.querySelector('#reset').onclick=()=>{stage='initial';render()};document.querySelector('#saved').onclick=()=>{scene='birth';stage='saved';render()};render();
</script></html>

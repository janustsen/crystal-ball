<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open mist · birth details</title><style>
@font-face{font-family:Fell;src:url(study-assets/display.woff2)}@font-face{font-family:Hanken;src:url(study-assets/body.woff2)}*{box-sizing:border-box}body{margin:0;background:#100c09;color:#f1e9dc;font:16px Hanken,system-ui,sans-serif}body.large{font-size:32px}main{max-width:390px;margin:auto;padding:24px 24px 120px;min-height:100vh;background:radial-gradient(ellipse at 90% 100%,#34221466,transparent 70%)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #614c3466;margin-bottom:24px}header span{font-family:Fell;font-size:1.375em}h1{font:1.75em/1.2 Fell;margin:12px 0}h2{font:1.375em/1.3 Fell;margin:12px 0}p{line-height:1.45;margin:12px 0}.muted,label{font-size:.875em;color:#b9ab97;line-height:1.45}.gold{color:#e0a458}button,input,summary{font:inherit;min-height:48px}button{color:#f1e9dc;background:none;border:0;padding:12px 0;cursor:pointer;text-align:left}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid #e0a458;outline-offset:4px}input{display:block;width:100%;background:transparent;color:#f1e9dc;border:0;border-bottom:1px solid #79634a;border-radius:0;padding:12px 0;margin:4px 0 18px}label{display:block}.primary{display:block;width:100%;text-align:center;background:#ebd5b0;color:#120e0b;border-radius:30px;padding:16px;margin:18px 0;font-weight:600}.quiet{display:block;width:100%;color:#c8dfe8;border-bottom:1px solid #614c3466}.row{border-bottom:1px solid #614c3466;padding:16px 0}.row button{display:block;color:#c8dfe8}.error{color:#f1e9dc;border-left:2px solid #e0a458;padding-left:12px;margin:8px 0 16px}.error label{color:#e0a458}.saved{padding:24px 0;border-block:1px solid #614c3466;margin:24px 0}.saved h2{margin-top:8px}.step{color:#e0a458;font-size:.875em}.progress{display:flex;gap:8px;margin:18px 0}.progress i{flex:1;height:2px;background:#614c34}.progress i.on{background:#e0a458}details{border-bottom:1px solid #614c3466;padding:12px 0}summary{cursor:pointer;padding:10px 0;color:#c8dfe8}#study{max-width:390px;margin:auto;padding:20px;font-size:14px;background:#211a13}#study a{display:inline-block;color:#e0a458;padding:10px}#status{color:#e0a458}#status:empty{display:none}.large main{padding-top:16px}.large header{margin-bottom:16px}.large .saved{padding:16px 0;margin:16px 0}.pair{display:flex;justify-content:space-between;gap:12px;align-items:center}.large .pair{display:block}
footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,390px);height:76px;display:flex;align-items:center;justify-content:space-around;background:#120e0b;border-top:1px solid #614c3466;font-size:.8125em;color:#b9ab97}.large footer{height:96px}footer span{text-align:center}footer i{display:block;font-style:normal;font-size:20px;color:#e0a458;margin-bottom:8px}</style><div id="study"></div><main id="app"></main><footer aria-hidden="true"><span><i>♙</i>Home</span><span><i>✧</i>Sky</span><span><i>◉</i>Ask</span><span><i>⌛</i>History</span><span><i>♧</i>You</span></footer><script>
const p=new URLSearchParams(location.search),variant=p.get('variant')||'a',state=p.get('state')||'initial',large=p.get('large')==='1';if(large)document.body.classList.add('large');
const button=(label,primary=false,action='study')=>`<button class="${primary?'primary':'quiet'}" data-action="${action}">${label}</button>`;
const time=`<label for="time">Local birth time · 24-hour clock</label><input id="time" value="${state==='invalid'?'25:99':'14:30'}" aria-invalid="${state==='invalid'}" aria-describedby="time-help"><p id="time-help" class="${state==='invalid'?'error':'muted'}">${state==='invalid'?'Enter a time from 00:00 to 23:59.':'For example, 14:30 is 2:30 pm.'}</p>`;
const city=`<label for="city">Birth city</label><input id="city" placeholder="City, country" value="${state==='initial'?'':'Copenhagen'}">${state==='initial'?button('Find city'): '<p class="muted">Selected · Copenhagen, Denmark</p>'+button('Change city')}`;
const privacy='<p class="muted">City search sends only the city name to Open-Meteo / GeoNames.</p>';
const saved='<p class="step">✓ Calculated and saved on this device</p><h2>Aquarius Moon<br>Libra rising</h2><p class="muted">Copenhagen, Denmark · 14:30</p>';
let html='<header><span>You</span><button data-action="study">Close</button></header>';
if(variant==='a'){
 html+='<h1>Birth details</h1><p class="muted">Optional · your Moon and rising.</p>';
 if(state==='saved')html+='<section class="saved">'+saved+'</section>'+button('Done',true)+button('Edit details')+button('Forget birth time and place');
 else html+=time+city+button('Calculate and save',true)+privacy;
}
if(variant==='b'){
 const n=state==='saved'?2:1;html+=`<p class="step">Birth details · ${n} of 2</p><div class="progress" aria-hidden="true"><i class="on"></i><i class="${n===2?'on':''}"></i></div>`;
 if(state==='saved')html+='<h1>Your Moon and rising</h1>'+saved+button('Done',true)+button('Edit birth details')+button('Forget birth time and place');
 else html+='<h1>What time were you born?</h1><p class="muted">Optional. Next, choose your birth city.</p>'+time+button('Continue to city',true,'city-step')+button('Cancel');
}
if(variant==='c'){
 html+='<h1>Your birth details</h1><p class="muted">Review each detail, then save your chart.</p>';
 if(state==='saved')html+='<section class="saved">'+saved+'</section>'+button('Done',true);
 html+='<div class="row"><span class="muted">Birthday</span><p>15 June 1995</p></div><details '+(state!=='saved'?'open':'')+'><summary>Birth time · '+(state==='invalid'?'Needs correction':'14:30')+'</summary>'+time+'</details><details><summary>Birth city · Copenhagen</summary>'+city+privacy+'</details>';
 if(state!=='saved')html+=button('Calculate and save',true);else html+=button('Forget birth time and place');
}
document.querySelector('#app').innerHTML=html+'<p id="status" role="status"></p>';
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{if(b.dataset.action==='city-step'){document.querySelector('#app').innerHTML='<header><span>You</span><button onclick="location.reload()">Back</button></header><p class="step">Birth details · 2 of 2</p><h1>Where were you born?</h1>'+city+button('Calculate and save',true)+privacy+'<p role="status">Layout study only. No lookup or calculation.</p>'}else document.querySelector('#status').textContent='Layout study only. No lookup, calculation or saved-data change.'});
document.querySelector('#study').innerHTML='Open mist · three form structures. Prototype only.<br>'+['a','b','c'].map(v=>`<a href="?variant=${v}&state=${state}&large=${large?1:0}">${v.toUpperCase()}</a>`).join('')+['initial','invalid','saved'].map(s=>`<a href="?variant=${variant}&state=${s}&large=${large?1:0}">${s}</a>`).join('')+`<a href="?variant=${variant}&state=${state}&large=${large?0:1}">Text size</a><p>A · compact complete form: fewer steps, longer scroll. B · guided time/city: focused, adds navigation. C · editable summary: easy review, more disclosure controls.</p>`;if(p.has('capture'))document.querySelector('#study').remove();
</script></html>

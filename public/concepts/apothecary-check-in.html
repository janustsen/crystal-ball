const params=new URLSearchParams(location.search);let mode=params.get('mode')||'folded',large=params.get('large')==='1',saved=params.get('saved')!=='0',editing=false,selected='Not quite',savedChoice='Not quite';function draw(){const folded=mode==='folded'&&saved&&!editing;document.querySelector('main').className=`room desk ${mode} ${large?'large':''}`;document.querySelector('#note').textContent={stacked:'All choices stay visible; saved state repeats across three elements.',compact:'Choices compare in one row at normal text, stacking at200%.',folded:'Saved outcome becomes one note; Change outcome reopens all choices.'}[mode];document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));document.querySelector('#heading').textContent=folded?'Your check-in':'What happened?';document.querySelector('#outcome').innerHTML=folded?`<p class="small">Saved outcome</p><p class="summary">${selected}</p>`:`<div class="choices" role="radiogroup" aria-label="Outcome">${['Yes','Not quite','Not yet'].map(value=>`<button class="choice" role="radio" aria-checked="${selected===value}" data-value="${value}">${value}</button>`).join('')}</div><p class="small">${saved?'Saved · '+selected:'Not saved yet.'}</p>`;document.querySelector('#actions').innerHTML=folded?'<button class="edit" id="edit">Change outcome</button>':`<button class="${saved?'edit quiet':'wood'}" id="save" ${saved?'disabled':''}>${saved?'Saved':'Save outcome'}</button>${saved?'<p class="small">Choose again to change, then save.</p>':''}${editing?'<button class="edit" id="cancel">Cancel changes</button>':''}`;document.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>{selected=b.dataset.value;saved=false;draw()});document.querySelector('#edit')?.addEventListener('click',()=>{editing=true;draw()});document.querySelector('#save')?.addEventListener('click',()=>{savedChoice=selected;saved=true;editing=false;draw()});document.querySelector('#cancel')?.addEventListener('click',()=>{selected=savedChoice;saved=true;editing=false;draw()});}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;editing=false;draw()});document.querySelector('#scale').onclick=()=>{large=!large;draw()};document.querySelector('#reset').onclick=()=>{saved=false;editing=false;draw()};draw();

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crystal Ball · Font directions</title><link rel="stylesheet" href="study-assets/orb.css"><style>
@font-face{font-family:Cormorant;src:url(font-assets/cormorantgaramond.ttf);font-weight:300 700}@font-face{font-family:DM;src:url(font-assets/dmsans.ttf);font-weight:100 1000}@font-face{font-family:Fraunces;src:url(font-assets/fraunces.ttf);font-weight:100 900}@font-face{font-family:Manrope;src:url(font-assets/manrope.ttf);font-weight:200 800}@font-face{font-family:Lora;src:url(font-assets/lora.ttf);font-weight:400 700}@font-face{font-family:Source;src:url(font-assets/sourcesans3.ttf);font-weight:200 900}
*{box-sizing:border-box}body{margin:0;background:#100c09;color:#f1e9dc;font:16px/1.5 system-ui,sans-serif}button,select{font:inherit;min-height:44px;color:inherit;background:#211910;border:1px solid #79634a;border-radius:8px;padding:8px 12px;cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #e0a458;outline-offset:3px}button[aria-pressed=true]{background:#ebd5b0;color:#21160d}aside{max-width:1000px;margin:auto;padding:24px}aside h1{font:500 26px/1.2 system-ui;margin:0 0 12px}aside p{margin:12px 0;color:#cdbda8}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.screens{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(390px,100%),1fr));gap:28px;max-width:850px;margin:0 auto 32px;padding:0 12px}.sample{min-width:0}.sample>h2{font:500 15px system-ui;color:#e0a458}.phone{font-family:var(--body);font-size:16px;line-height:1.5;position:relative;height:844px;max-width:390px;margin:auto;overflow:auto;background:radial-gradient(ellipse at 80% 90%,#3b281950,transparent 65%),#100c09;scrollbar-width:thin}.phone.large{font-size:32px}.content{padding:24px 24px 30px;min-height:calc(100% - 76px)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:64px;margin-bottom:24px}.wordmark{font:500 26px/1.2 var(--display)}.balance{font:13px/1.4 var(--body);color:#d6c3a8}.phone h1{font:var(--weight) 1.75em/1.22 var(--display);margin:12px 0}.phone h2{font:var(--weight) 1.375em/1.35 var(--display);margin:12px 0}.phone p{margin:12px 0}.muted{color:#b9ab97}.caption{font-size:.75em;line-height:1.5;color:#cbbba5}.gold{color:#e0a458}.phone .orb{--s:261px;width:var(--s);height:var(--s);margin:auto}.hero{padding:40px 0 26px}.invitation{text-align:center;font-size:1em}.omen{margin-top:32px;padding:16px 0;border-top:1px solid #614c3466}.omen p{font:var(--weight) 1em/1.375 var(--display)}.primary{background:#ebd5b0;color:#24170d;text-align:center;padding:14px 12px;border-radius:24px;font-weight:600;margin:24px 0 12px}.link{color:#d7c6aa;padding:12px 0;min-height:48px}.row{border-bottom:1px solid #614c3466;padding:16px 0}.row h2{margin:6px 0}.nav{display:flex;justify-content:space-around;gap:4px;min-height:76px;padding:20px 4px;border-top:1px solid #614c3466;font-size:.75em;color:#b9ab97}.nav span{overflow-wrap:anywhere}.nav .active{color:#e0a458}.forecast{margin-top:30px;margin-bottom:24px}.forecast h1{font-size:1.5em;line-height:1.35}.signature{margin:32px auto;width:64px}.signature .orb{--s:64px}.plan{padding:20px 0;border-top:1px solid #614c3466}.plan.selected{border-top-color:#e0a458}.price{font:var(--weight) 1.5em/1.3 var(--display)}.large .hero{padding-top:0}.large .omen{margin-top:12px}.large .top{margin-bottom:12px}.capture aside,.capture .sample>h2{display:none}.capture .screens{display:block;padding:0;margin:0}.capture .sample{display:none}.capture .sample.chosen{display:block}.capture .phone{height:100vh;max-width:430px}.capture .content{min-height:calc(100% - 76px)}
</style><aside><h1>Three ways to give the mist a voice</h1><p>Same screens, words and colours. Only the font pairing changes. These are static composition studies; controls inside the samples are illustrative.</p><div class="controls" id="directions"><button data-pair="a">A · Moonlit editorial</button><button data-pair="b">B · Illustrated warmth</button><button data-pair="c">C · Quiet storyteller</button></div><p id="description"></p><div class="controls"><button id="scale" aria-pressed="false">200% text</button><label>Jump to <select id="screen"><option value="home">Home</option><option value="reveal">Reading reveal</option><option value="history">History</option><option value="plans">Plans</option></select></label></div><p id="sources"></p></aside><div class="screens" id="samples"></div><script type="module">
const pairs={a:{display:'Cormorant',body:'DM',weight:500,title:'Cormorant Garamond + DM Sans',description:'Elegant and lunar; the strongest contrast between mystical titles and clear controls. Fine serif details are more delicate at small sizes.',urls:['Cormorant+Garamond','DM+Sans']},b:{display:'Fraunces',body:'Manrope',weight:450,title:'Fraunces + Manrope',description:'Warm, softly illustrated letterforms echo the ball’s cartoon depth. More personality, with a slightly friendlier and less solemn tone.',urls:['Fraunces','Manrope']},c:{display:'Lora',body:'Source',weight:400,title:'Lora + Source Sans 3',description:'Calm, readable and story-like. The most restrained choice; less distinctive than the other two.',urls:['Lora','Source+Sans+3']}};
const params=new URLSearchParams(location.search);let pair=params.get('pair')||'b',large=params.get('large')==='1';if(!pairs[pair])pair='b';const chosen=params.get('screen')||'home';if(params.has('capture'))document.body.classList.add('capture');
const nav=active=>'<div class="nav">'+['Home','Sky','Ask','History','You'].map(x=>'<span class="'+(x===active?'active':'')+'">'+x+'</span>').join('')+'</div>';
const orb=await fetch('study-assets/orb.json').then(r=>r.json());
const content={home:'<div class="top"><span class="wordmark">Crystal Ball</span><span class="balance">3 readings left</span></div><div class="hero">'+orb+'</div><p class="invitation">Touch the ball.</p><p class="caption" style="text-align:center">For fun. Not a guarantee.</p><div class="omen"><span class="caption gold">Today’s omen · free</span><p>Tonight, the moon invites a quieter kind of courage.</p></div>',reveal:'<div class="top"><span>×</span><span class="balance">3 readings left</span></div><p class="caption gold">Speculative forecast · not a guarantee</p><div class="forecast"><h1>You’ll find your rhythm at the pottery wheel this winter.</h1></div><p class="muted">A small weekly class gives this possibility room to grow.</p><div class="link">Why this forecast? ›</div><div class="primary">Share this glimpse</div><div class="link">Remind me</div><div class="link">Ask again</div><div class="signature">'+orb+'</div>',history:'<div class="top"><span class="wordmark">History</span><span class="balance">3 readings left</span></div><p class="caption">Your saved glimpses</p><div class="row"><span class="caption gold">Today · Learning</span><h2>You’ll find your rhythm at the pottery wheel this winter.</h2><p class="caption">Will I start learning pottery this winter?</p><div class="link">Read forecast ›</div></div><div class="row"><span class="caption gold">Yesterday · Life</span><h2>A familiar place may bring a new friendship.</h2><p class="caption">How might my social life change?</p><div class="link">Read forecast ›</div></div>',plans:'<div class="top"><span>×</span><span class="balance">Plans · test mode</span></div><h1>A little more wonder.</h1><p class="muted">More readings, deeper explanations and golden editions.</p><div class="plan selected"><span class="gold">◉ Yearly</span><p class="price">$39.99 <span class="caption">/ year</span></p><p class="caption">Illustrative price for this font study.</p></div><div class="plan"><span>○ Monthly</span><p class="price">$5.99 <span class="caption">/ month</span></p></div><div class="primary">Continue · test mode</div><p class="caption">No payment is taken in this preview.</p><div class="link">Restore purchases</div>'};
document.querySelector('#samples').innerHTML=Object.entries(content).map(([key,value])=>'<section class="sample '+(key===chosen?'chosen':'')+'" id="'+key+'"><h2>'+key+'</h2><div class="phone"><div class="content">'+value+'</div>'+(['home','history'].includes(key)?nav(key==='home'?'Home':'History'):'')+'</div></section>').join('');
function render(){const p=pairs[pair];document.body.style.setProperty('--display',p.display);document.body.style.setProperty('--body',p.body);document.body.style.setProperty('--weight',p.weight);document.querySelector('#description').textContent=p.title+' — '+p.description;document.querySelector('#sources').innerHTML='Free, OFL fonts: '+p.urls.map(x=>'<a style="color:#e0a458" href="https://fonts.google.com/specimen/'+x+'">'+x.replaceAll('+',' ')+'</a>').join(' + ');document.querySelectorAll('[data-pair]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.pair===pair));document.querySelectorAll('.phone').forEach(p=>p.classList.toggle('large',large));document.querySelector('#scale').setAttribute('aria-pressed',large);}
document.querySelectorAll('[data-pair]').forEach(b=>b.onclick=()=>{pair=b.dataset.pair;render()});document.querySelector('#scale').onclick=()=>{large=!large;render()};document.querySelector('#screen').onchange=e=>document.getElementById(e.target.value).scrollIntoView({block:'start'});render();
</script></html>

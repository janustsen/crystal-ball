</style><aside><h1>Space for the next action</h1><p>Throwaway Open mist comparison. Selected fonts stay fixed. Controls illustrate routes; no model, storage, permission or social operations occur.</p><div class="controls"><select id="scene"><option value="composer">Question composer</option><option value="omen">Unavailable omen</option><option value="circles">Offline Circles</option></select><button data-variant="a">A</button><button data-variant="b">B</button><button data-variant="c">C</button><button id="large">200% text</button><button id="short">500px viewport</button><button id="reset">Reset</button></div><p id="tradeoff"></p></aside><main class="phone"><header class="header"></header><section class="content"></section><div id="decision"></div><footer class="nav"></footer></main><script type="module">
const params=new URLSearchParams(location.search),art=await fetch('study-assets/orb.json').then(r=>r.json()),tabs=await fetch('study-assets/tabs.json').then(r=>r.json());let scene=params.get('scene')||'composer',variant=params.get('variant')||'a',large=params.get('large')==='1',short=params.get('short')==='1';const phone=document.querySelector('.phone'),content=document.querySelector('.content'),header=document.querySelector('.header'),footer=document.querySelector('.nav'),decision=document.querySelector('#decision');if(params.has('capture'))document.body.classList.add('capture');
const explanations={composer:{a:'A · Continuous page: header, subject and sending disclosure scroll with the form. More coherent content; navigation can leave the viewport.',b:'B · Focused composer: compact Back row, subject and sending details behind a clearly named disclosure, uninterrupted question field. Less clutter; details take an extra tap.',c:'C · Decision tray: question scrolls above a fixed Ask action and sending scope. Action stays available; the tray takes space from enlarged input.'},omen:{a:'A · Editorial explanation: a complete sentence explains the once-daily attempt, including unsuccessful attempts. Always visible; more prose below the orb.',b:'B · Quiet status and explanation: tomorrow remains visible; Why no omen opens the daily-attempt policy. Short Home; explanation needs a tap.',c:'C · Daily status tray: tomorrow and attempt policy stay in a separate lower band beneath the hero. Stable status location; competes with navigation space.'},circles:{a:'A · Continuous recovery page: offline explanation, prominent Retry, then available information and unavailable setup. All context visible; longer page.',b:'B · Focused recovery: one honest offline message and Retry, with explanatory detail on request. Quiet and actionable; setup is deferred until online.',c:'C · Recovery tray: a calm overview scrolls above connection status and persistent Retry. Reachable action; less room for enlarged informational content.'}};
const subject='<button class="quiet" type="button" id="subject">About myself · change ›</button>',scope='<p class="context-line">For entertainment. Your question and answers go to the prediction engine.</p>',field='<label class="field" for="question">Your question</label><textarea id="question">Will I start learning pottery this winter?</textarea>',ask='<button class="primary" id="ask">Ask the Ball</button>',policy='The Ball tries once a day, even when no omen is saved.',offline='<h1>Circles are offline.</h1><p class="caption">We can’t check your circle or create one right now.</p>',retry='<button class="primary" id="retry">Retry connection</button>',circleInfo='<p class="caption">In a circle, friends share signs and broad themes. Your questions and private answers stay private.</p>';
function bind(){document.querySelector('#ask')?.addEventListener('click',()=>{content.innerHTML='<h1>Prototype only</h1><p>No question was sent. Use Reset to compare another layout.</p>';decision.innerHTML='';decision.className='';content.scrollTop=0});document.querySelector('#retry')?.addEventListener('click',e=>{e.currentTarget.textContent='Still offline · retry';const note=document.createElement('p');note.className='caption';note.textContent='Illustrative feedback only; no network request.';e.currentTarget.after(note)});document.querySelector('#subject')?.addEventListener('click',()=>alert('Prototype only. Production opens the existing subject editor.'));}
function render(){phone.className='phone'+(large?' large':'')+(short?' short':'');phone.style.height=params.has('capture')?'100vh':short?'500px':'844px';document.querySelector('#scene').value=scene;document.querySelector('#large').setAttribute('aria-pressed',large);document.querySelector('#short').setAttribute('aria-pressed',short);document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.variant===variant));document.querySelector('#tradeoff').textContent=explanations[scene][variant];content.className='content';decision.className='';decision.innerHTML='';header.className='header';footer.style.display=scene==='composer'?'none':'flex';footer.innerHTML=['Home','Sky','Ask','History','You'].map(name=>'<span class="'+(name===(scene==='omen'?'Home':'Sky')?'selected':'')+'">'+(name==='Ask'?art:tabs[name==='Sky'?'Explore':name].replaceAll('currentColor','#b9ab97'))+'<span>'+name+'</span></span>').join('');header.style.display='flex';header.innerHTML=scene==='omen'?'<span class="brand">Crystal Ball</span><span class="balance">1 reading'+(large?'<br>':' ')+'left</span>':scene==='circles'?'<span class="page-name">Sky</span>':'<button class="back">‹ Home</button>';
if(scene==='composer'){
 if(variant==='a'){header.style.display='none';content.innerHTML='<div class="flow-header"><button class="back">‹ Home</button><span class="small-label">Your question</span></div>'+subject+scope+field+ask+'<button class="quiet">Speak instead</button>';}
 if(variant==='b'){header.classList.add('compact-header');content.innerHTML='<details class="details"><summary>About myself · sending details</summary>'+subject+scope+'</details>'+field+ask+'<button class="quiet">Speak instead</button>';}
 if(variant==='c'){header.classList.add('compact-header');content.innerHTML=subject+field+'<button class="quiet">Speak instead</button>';decision.className='sticky';decision.innerHTML=scope+ask;}
}else if(scene==='omen'){
 content.classList.add('home','compact-omen');content.innerHTML=art+'<p class="invitation">Touch the ball.</p><p class="disclaimer">For fun. Not a guarantee.</p>';const title='<div class="caption gold">Today’s omen · free</div>';
 if(variant==='a')content.innerHTML+='<div class="omen">'+title+'<p>No saved omen today.</p><p class="caption">'+policy+' Next attempt: tomorrow.</p></div>';
 if(variant==='b')content.innerHTML+='<div class="omen">'+title+'<p>No saved omen today.</p><p class="caption">Next attempt: tomorrow.</p><details class="details"><summary>Why no omen?</summary><p class="caption">'+policy+' Today’s attempt is used.</p></details></div>';
 if(variant==='c'){decision.className='sticky tray-home';decision.innerHTML=title+'<p>Next attempt: tomorrow.</p><p class="caption">No saved omen today. '+policy+'</p>';}
}else{
 if(variant==='a'){header.style.display='none';content.innerHTML='<div class="flow-header"><span class="page-name">Sky</span><span class="small-label">Circles</span></div>'+offline+retry+'<div class="quiet-room"><h2>Shared sky, private questions.</h2>'+circleInfo+'</div><p class="caption">Circle setup returns when the connection is restored.</p>';}
 if(variant==='b'){header.classList.add('compact-header');content.innerHTML='<div class="recovery-art" aria-hidden="true">◌</div>'+offline+retry+'<details class="details"><summary>About circles</summary>'+circleInfo+'<p class="caption">Setup returns when online.</p></details>';}
 if(variant==='c'){content.innerHTML='<h1>Your shared sky</h1>'+circleInfo+'<div class="quiet-room"><h2>Create a circle</h2><p class="caption">Invite friends when the connection returns. No circle has been created.</p></div>';decision.className='sticky';decision.innerHTML='<p class="context-line">Offline · circle setup unavailable</p>'+retry;}
}content.scrollTop=0;bind();}
document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>{variant=b.dataset.variant;render()});document.querySelector('#scene').onchange=e=>{scene=e.target.value;render()};document.querySelector('#large').onclick=()=>{large=!large;render()};document.querySelector('#short').onclick=()=>{short=!short;render()};document.querySelector('#reset').onclick=render;render();
</script></html>

@font-face{font-family:Fell;src:url(study-assets/display.woff2)}@font-face{font-family:Hanken;src:url(study-assets/body.woff2)}*{box-sizing:border-box}html{background:#100c09;color:#f1e9dc;font-family:Hanken,sans-serif;font-size:16px}body{margin:0;background:radial-gradient(ellipse at 85% 90%,#4d341c66,transparent 62%);min-height:100vh}body.large{font-size:32px}main{max-width:390px;margin:auto;padding:24px;min-height:100vh}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0 24px;font-size:.875em}header button{min-width:44px}h1,h2,.quote{font-family:Fell,serif;font-weight:400}h1{font-size:1.75em;line-height:1.18;margin:16px 0}h2{font-size:1.35em;line-height:1.3;margin:16px 0}.quote{font-size:1.375em;line-height:1.3;margin:14px 0}p{line-height:1.55;margin:12px 0}button,select,input,textarea{font:inherit;color:inherit}button,a,summary{touch-action:manipulation}button,select{min-height:48px}button{background:none;border:0;cursor:pointer;padding:12px 0;text-align:left}button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #e0a458;outline-offset:4px}label{display:block}.small{font-size:.875em;line-height:1.45;color:#b9ab97}.gold{color:#e0a458}.rule{border-bottom:1px solid #614c3466;padding:16px 0}.primary{display:block;text-align:center;width:100%;padding:14px 18px;background:#ebd5b0;color:#120e0b;border-radius:28px;box-shadow:0 3px #7a5527;min-height:54px;font-weight:600;margin:14px 0}.quiet{display:block;width:100%;border-bottom:1px solid #614c3466;margin-top:8px;text-align:center}input,textarea,select{display:block;width:100%;border:0;border-bottom:1px solid #79634a;background:transparent;padding:14px 0;border-radius:0;margin:6px 0 14px}textarea{font-family:Fell,serif;font-size:1.5em;line-height:1.3;resize:vertical;min-height:5.6em}select{appearance:auto}option{background:#120e0b}fieldset{border:0;padding:0;margin:0 0 16px}legend{font-size:.875e e .context{flex-wrap:wrap}.large header{margin-bottom:16px}

.sheet{background:#19130e;padding:20px;margin:20px -24px -24px;min-height:50vh}.excerpt{font-size:.875em;color:#b9ab97;line-height:1.4}.passage{margin:24px 0;padding-bottom:24px;border-bottom:1px solid #614c3455}.passage .number{color:#e0a458;font-size:.75em}.reading{font-size:1.0625em;line-height:1.6}.reading p{white-space:pre-wrap}.pager{display:flex;justify-content:space-between;gap:12px}.large .pager{flex-direction:column}body{background:#100c09}.compact textarea{min-height:3em;height:3em}details p{padding:8px 0}#study{padding:20px;background:#211a13}#study a{color:#e0a458;padding:10px;display:inline-block} .date-parts{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:12px}.large .date-parts{grid-template-columns:1fr} .hero-state{margin-top:64px} .large .hero-state{margin-top:20px} .calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.calendar button{text-align:center;min-height:44px;padding:4px;font-size:.875em}.calendar button[aria-pressed=true]{background:#ebd5b0;color:#120e0b;border-radius:50%}.calendar label{grid-column:span 3}.calendar input{font-size:.8em}textarea.answer{font-family:Hanken;font-size:1.125em;min-height:6em}.step{display:flex;justify-content:space-between;align-items:center;gap:12px}.context-text{font-size:1em;line-height:1.4;margin:12px 0 18px}</style><div id="study"></div><main id="app"></main><script>const params=new URLSearchParams(location.search),screen=params.get('screen')||'date',variant=params.get('variant')||'a',large=params.get('large')==='1';if(large)document.body.classList.add('large');const question='How settled is your plan right now, honestly?',header='<header><span>Crystal Ball</span></header>';let answer='',day='',month='',year='';
const editor='<label class="small" for="answer">Your answer</label><textarea class="answer" id="answer" rows="4" placeholder="Tell the Ball…"></textarea><p class="small">Write a few words to continue.</p><button id="continue" class="primary" disabled>Continue</button><p id="status" role="status"></p>';
let html=header;if(screen==='answer'){
 if(variant==='a')html+='<div class="step"><button id="choices" class="gold">‹ Back to choices</button><span class="small">1 of 3</span></div><p class="context-text">'+question+'</p>'+editor;
 if(variant==='b')html+='<p class="small">1 of 3</p><h1>In your own words</h1><details><summary>View the question</summary><p>'+question+'</p></details>'+editor+'<button id="choices" class="quiet">Back to choices</button>';
 if(variant==='c')html+='<p class="small">1 of 3 · Your context</p><p class="quote">'+question+'</p><div class="passage">'+editor+'</div><button id="choices" class="quiet">Back to choices</button>';
}else{
 html+='<p class="small">A little about you · 1 of 2</p><h1>When is your birthday?</h1><p class="small">Optional. Used for your Sun sign and age-appropriate readings.</p>';
 if(variant==='a')html+='<label class="small" for="date">Birthday · year-month-day</label><input id="date" placeholder="YYYY-MM-DD"><p class="small">For example, 1995-06-15. Enter an actual calendar date.</p>';
 if(variant==='b')html+='<div class="date-parts"><label class="small">Day<input id="day" inputmode="numeric" placeholder="DD" maxlength="2"></label><label class="small">Month<input id="month" inputmode="numeric" placeholder="MM" maxlength="2"></label><label class="small">Year<input id="year" inputmode="numeric" placeholder="YYYY" maxlength="4"></label></div><p class="small">For example: day 15, month 6, year 1995.</p>';
 if(variant==='c')html+='<div class="date-parts"><label class="small">Month<input id="month" type="number" value="10" min="1" max="12"></label><label class="small">Year<input id="year" type="number" value="2026" min="1900" max="2026"></label></div><p class="small">Choose the month and year, then a day.</p><div class="calendar">'+Array.from({length:31},(_,i)=>'<button class="day" aria-label="Day '+(i+1)+'" aria-pressed="false">'+(i+1)+'</button>').join('')+'</div><p id="chosen" class="small">No day selected.</p>';
 html+='<button id="continue" class="primary">Continue</button><button id="skip" class="quiet">Skip for now</button><p id="status" role="status"></p>';
}document.querySelector('#app').innerHTML=html;
document.querySelector('#answer')?.addEventListener('input',e=>{answer=e.target.value;document.querySelector('#continue').disabled=!answer.trim()});document.querySelector('#continue').onclick=()=>document.querySelector('#status').textContent='Layout study only. No answer or birthday was submitted.';document.querySelector('#skip')?.addEventListener('click',()=>document.querySelector('#status').textContent='Layout study only. No age confirmation was changed.');document.querySelector('#choices')?.addEventListener('click',()=>document.querySelector('#status').textContent='Layout study only. Your draft would be retained when returning to choices.');document.querySelectorAll('.day').forEach(el=>el.onclick=()=>{document.querySelectorAll('.day').forEach(n=>n.setAttribute('aria-pressed','false'));el.setAttribute('aria-pressed','true');document.querySelector('#chosen').textContent='Selected day '+el.textContent+'.';});
document.querySelector('#study').innerHTML='Throwaway Open mist comparison. No request/profile changes.<br>'+['a','b','c'].map(v=>'<a href="?screen='+screen+'&variant='+v+'&large='+(large?1:0)+'">'+v.toUpperCase()+'</a>').join('')+'<a href="?screen='+(screen==='date'?'answer':'date')+'&variant='+variant+'&large='+(large?1:0)+'">Switch task</a><a href="?screen='+screen+'&variant='+variant+'&large='+(large?0:1)+'">Change text size</a>';if(params.has('capture'))document.querySelector('#study').remove();

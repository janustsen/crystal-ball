const forecast='You will be conversational in Spanish in six months.',qualifier='Speculative forecast · not a guarantee',image='<img class="story" src="expansion-39-assets/story.png" alt="Complete forecast image">',back='<button class="back">‹ Back to forecast</button>',download='<button class="primary">Download image</button>',text='<h2>'+forecast+'</h2><p class="caption">'+qualifier+'</p>',status=state==='success'?'<h2>Download started</h2><p>Check your browser’s downloads. Private answers are excluded.</p>':state==='error'?'<h2>Couldn’t export the image</h2><p>Your forecast is still saved. Try downloading again.</p><button class="primary">Try again</button>':state==='invite'?'<h2>Your invitation link</h2><p>A fresh question for your friend. Your forecast and answers are not included.</p><button class="primary">Copy invitation link</button><button class="quiet">Share link again ↗</button><details><summary>View link</summary><p class="small-note">https://example.invalid/?friend=1&amp;question=What%20will%20my%20life%20look%20like%20next%20year</p></details>':'<h2>Reminder preview</h2><p>Check back on October 31. Local notifications need the iOS or Android app.</p><p class="caption">No reminder was scheduled in this browser.</p>';

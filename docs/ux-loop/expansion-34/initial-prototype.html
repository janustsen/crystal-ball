@font-face{font-family:Fraunces;src:url(font-assets/fraunces-static.ttf)}@font-face{font-family:Manrope;src:url(font-assets/manrope-static.ttf)}*{box-sizing:border-box}body{margin:0;background:#100c09;color:#f1e9dc;font:16px/1.5 Manrope,system-ui}aside{max-width:850px;margin:auto;padding:24px}aside h1{font:26px/1.25 Fraunces}aside p{color:#cbbba5}button,select{font:inherit;min-height:48px;padding:12px;color:inherit;background:transparent;border:1px solid #79634a;cursor:pointer;border-radius:8px}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #e0a458;outline-offset:3px}button[aria-pressed=true]{background:#ebd5b0;color:#24170d}.controls{display:flex;gap:8px;flex-wrap:wrap}.phone{display:flex;flex-direction:column;height:844px;max-width:390px;margin:auto;min-height:844px;background:radial-gradient(ellipse at 80% 90%,#3b281950,transparent 65%),#100c09;overflow:hidden}.large{font-size:32px}.header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:32px 24px 12px;min-height:96px}.header button{border:0;padding:8px;min-width:44px;font-size:28px}.balance{font-size:.8125em;color:#cbbba5}.content{flex:1;overflow-y:auto;padding:14px 24px 36px;min-width:0}h1{font:400 1.75em/1.22 Fraunces;margin:12px 0}h2{font:400 1.375em/1.35 Fraunces;margin:12px 0}p{margin:12px 0}.caption{font-size:.875em;line-height:1.45;color:#b9ab97}.gold{color:#e0a458}.primary{display:block;width:100%;border:1px solid #ebd5b0;border-radius:27px;background:#ebd5b0;color:#24170d;font-weight:600;text-align:center;margin:14px 0;box-shadow:0 3px #7a5527}.quiet{display:block;width:100%;border:0;border-bottom:1px solid #614c3455;border-radius:0;color:#f2c284;text-align:left;padding:14px 0}.center{text-align:center}.orb{--s:240px;width:var(--s);height:calc(var(--s)*1.125);margin:auto}.orb .gb,.orb .pool,.orb .halo,.orb::before{animation:none!important}.gateway{padding-top:38px}.gateway .orb{margin-bottom:26px}.large .gateway{padding-top:0}.large .gateway .orb{--s:190px;margin-bottom:12px}.large h1{font-size:1.5em}.field-label{display:block;margin:14px 0 6px}.input{display:block;width:100%;font:1.125em/1.444 Manrope;color:#f1e9dc;background:transparent;border:1px solid #79634a;border-radius:12px;padding:16px 12px;min-height:138px;resize:none}.large .input{min-height:242px}.subject{font-size:.875em;padding:12px 0;margin-bottom:8px;border-bottom:1px solid #614c3466}.study-result{padding:16px 0;color:#e0a458}.notice{font-size:.875em;line-height:1.45;color:#b9ab97}.disabled{opacity:.55}.progress{height:2px;background:#614c3466;overflow:hidden;margin:24px 0}.progress i{display:block;height:100%;width:100%;background:#e0a458;transform-origin:left;animation:progress 650ms linear both}@keyframes progress{from{transform:scaleX(0)}to{transform:scaleX(1)}}.consent{display:flex;align-items:center;gap:12px;border-bottom:1px solid #614c3466;padding:12px 0;min-height:52px}.consent input{width:24px;height:24px;flex-shrink:0;accent-color:#e0a458}.consent-link{padding:8px 0;border:0;font-size:.875em;color:#e0a458}.consent-details{margin-bottom:20px}.capture aside{display:none}.capture .phone{height:100vh;min-height:0}.capture .content{padding-bottom:24px}.capture .header{padding-top:32px}.capture .header span:first-child{font-size:28px}.release-stage{height:380px;position:relative;display:flex;align-items:center;justify-content:center}.release-art{position:relative;width:240px;height:270px}.release-art .halo,.release-art .pool,.release-art .orb::before{display:none}.part{position:absolute;inset:0}.left{clip-path:inset(0 50% 30px 0);animation:left 1100ms ease-in-out both}.right{clip-path:inset(0 0 30px 50%);animation:right 1100ms ease-in-out both}.bottom{position:absolute;top:240px;left:0;height:30px;width:240px;overflow:hidden}.bottom>div{margin-top:-240px}.core{position:absolute;left:65px;top:28px;width:110px;height:190px;border-radius:50%;background:radial-gradient(ellipse,#f6dab0 0%,#e0a45899 25%,#e0a45822 55%,transparent 72%);animation:core 1100ms ease-in-out both}.seam{position:absolute;left:119px;top:24px;height:185px;width:2px;background:linear-gradient(transparent,#f2c284,transparent);animation:core 1100ms ease-in-out both}.ring{position:absolute;left:20px;top:20px;width:200px;height:200px;border:2px solid #e0a458;border-radius:50%;animation:ring 1100ms ease-out both}.release-art.b .left{clip-path:inset(0 0 135px 0);transform-origin:22% 50%;animation:lid 1100ms cubic-bezier(.2,.75,.2,1) both}.release-art.b .right{clip-path:inset(120px 0 30px 0);animation:base 1100ms ease-out both}.release-art.b .seam{left:22px;top:120px;width:196px;height:2px}.release-art.c .whole{animation:dissolve 1100ms ease-in-out both}.release-art.c .mist{position:absolute;inset:-16px;border-radius:50%;background:radial-gradient(ellipse at 45% 55%,#e0a45844,transparent 65%);animation:mist 1100ms ease-out both}.payoff{animation:payoff 700ms cubic-bezier(.2,.75,.2,1) both}.signature .orb{--s:64px;margin-top:24px}.space-actions{display:flex;justify-content:space-between;gap:12px}.space-actions button{border:0;padding:12px 0;color:#f2c284}
@keyframes left{0%,78%{transform:none;opacity:1}90%{transform:translateX(-10px) rotate(-2deg);opacity:.8}100%{transform:translateX(-14px) rotate(-3deg);opacity:0}}@keyframes right{0%,78%{transform:none;opacity:1}90%{transform:translateX(10px) rotate(2deg);opacity:.8}100%{transform:translateX(14px) rotate(3deg);opacity:0}}@keyframes core{0%,30%{opacity:0;transform:scale(.4)}78%{opacity:.65;transform:scale(.8)}88%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.05)}}@keyframes ring{0%,78%{opacity:0;transform:scale(.7)}85%{opacity:.4}100%{opacity:0;transform:scale(1.35)}}@keyframes lid{0%,78%{transform:none;opacity:1}90%{transform:translate(-5px,-28px) rotate(-7deg);opacity:.85}100%{transform:translate(-8px,-42px) rotate(-9deg);opacity:0}}@keyframes base{0%,80%{opacity:1}100%{opacity:0}}@keyframes dissolve{0%,65%{transform:none;opacity:1}82%{transform:scale(.98,1.02);opacity:.8}100%{transform:scale(1.07);opacity:0}}@keyframes mist{0%,55%{opacity:0;transform:scale(.6)}82%{opacity:.6}100%{opacity:0;transform:scale(1.25)}}@keyframes payoff{0%{transform:translateY(32px) rotate(4deg)}75%{transform:translateY(-3px) rotate(-.3deg)}100%{transform:none}}
</style><aside><h1>Entry, consent and release</h1><p>Throwaway interaction/composition studies. Selected fonts and Open mist stay fixed. These samples make no forecast, consent record, microphone request or purchase.</p><div class="controls"><select id="scene"><option value="approach">Starting a question</option><option value="consent">Consent before sending</option><option value="opening">Opening the ball</option></select><button data-variant="a">A</button><button data-variant="b">B</button><button data-variant="c">C</button><button id="large">200% text</button><button id="play">Replay</button></div><p id="explanation"></p></aside><main class="phone"><div class="header"><span>×</span><span class="balance">3 readings left</span></div><div class="content" id="content"></div></main><script type="module">
const q=new URLSearchParams(location.search);let scene=q.get('scene')||'approach',variant=q.get('variant')||'a',large=q.get('large')==='1';let timer;const art=await fetch('study-assets/orb.json').then(r=>r.json());const c=document.querySelector('#content');if(q.has('capture'))document.body.classList.add('capture');
const explanation={approach:{a:'A · Direct typing. Tap the Home ball and start composing immediately; speaking stays optional in the composer. Fastest path, less ceremonial pause.',b:'B · Deliberate choice. Keep the orb, offer Type and Speak explicitly, and wait for a choice. Clear control, one extra decision.',c:'C · Explicit automatic progression. Keep the 650ms bridge with progress feedback and an immediate typing escape. Continuity, but still an interstitial.'},consent:{a:'A · Local explanation. Keep the disabled submit and show why beside it, with a link to the full consent. More nearby text.',b:'B · Actionable consent gate. Review consent replaces the disabled submit; it opens the full disclosure and checkbox. Same required consent, an actionable next step.',c:'C · Consent first. Show provider permission before the composer, then continue to the question. Clearest prerequisite, an extra screen before writing.'},opening:{a:'A · Lit seam. Retain a central glass split but fill the separation with bounded warm light. Familiar structure, a visible seam.',b:'B · Lifting glass cap. The upper hemisphere lifts like a chest lid above a warm core. Strong physical opening, more literal.',c:'C · Mist release. The sphere compresses and dissolves into a single mist bloom. Softest material transition, no literal crack.'}};
const notice='<p class="notice">For entertainment. Your question and answers are sent to generate a forecast.</p>';const permission='<div class="consent-details"><h2>AI processing</h2><p class="notice">Allow Test provider to process your questions and answers to generate your forecast.</p><label class="consent"><input id="permission" type="checkbox">Allow AI processing</label></div>';
const field='<label class="field-label" for="question">Your question</label><textarea class="input" id="question">Will I start learning pottery this winter?</textarea>';const subject='<div class="subject">About myself · change</div>';
function composer(){c.innerHTML=subject+notice+field+'<button class="primary" data-study>Ask the Ball</button><button class="quiet" data-study>Speak instead</button>';bind();}
function bind(){c.querySelectorAll('[data-study]').forEach(b=>b.onclick=()=>{let p=c.querySelector('.study-result');if(!p){p=document.createElement('p');p.className='study-result';c.append(p)}p.textContent='Layout study — no question sent.'})}
function reviewConsent(){c.innerHTML=permission+'<button class="primary" id="return" disabled>Return to question</button>';c.querySelector('#permission').onchange=e=>{c.querySelector('#return').disabled=!e.target.checked};c.querySelector('#return').onclick=()=>{composer();};}
function payoff(){c.innerHTML='<div class="payoff"><p class="caption gold">Speculative forecast · not a guarantee</p><h2>You’ll find your rhythm at the pottery wheel this winter.</h2><p class="caption">Check-in reminder · Nov 1, 2026</p><button class="quiet" data-study>Why this forecast? ⌄</button><button class="primary" data-study>Share this glimpse</button><div class="space-actions"><button data-study>Remind me</button><button data-study>Ask again</button></div><div class="signature">'+art+'</div></div>';bind();}
function render(){clearTimeout(timer);document.querySelector('.balance').style.visibility=scene==='approach'&&variant!=='a'?'hidden':'visible';document.querySelector('.balance').innerHTML=large?'3 readings<br>left':'3 readings left';document.querySelector('.phone').classList.toggle('large',large);document.querySelector('#scene').value=scene;document.querySelector('#large').setAttribute('aria-pressed',large);document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.variant===variant));document.querySelector('#explanation').textContent=explanation[scene][variant];
 if(scene==='approach'){
  if(variant==='a')composer();
  if(variant==='b'){c.innerHTML='<div class="gateway center">'+art+'<h2>Your question.</h2><button class="primary" id="type">Type a question</button><button class="quiet center" id="speak">Speak a question</button></div>';c.querySelector('#type').onclick=composer;c.querySelector('#speak').onclick=()=>{c.innerHTML='<h2>Speak your question.</h2><p class="caption">Prototype only — microphone access is not requested.</p><button class="primary" id="type">Type instead</button>';c.querySelector('#type').onclick=composer;};}
  if(variant==='c'){c.innerHTML='<div class="gateway center">'+art+'<h2>Preparing your question…</h2><p class="caption">Voice input opens automatically.</p><div class="progress"><i></i></div><button class="quiet center" id="type">Type instead</button></div>';c.querySelector('#type').onclick=composer;if(!q.has('capture'))timer=setTimeout(()=>{c.innerHTML='<h2>Speak your question.</h2><p class="caption">Prototype only — microphone access is not requested.</p><button class="primary" id="type">Type instead</button>';c.querySelector('#type').onclick=composer;},650);}
 }else if(scene==='consent'){
  if(variant==='a'){c.innerHTML=subject+notice+permission+field+'<p class="notice gold">Allow AI processing before asking.</p><button class="consent-link" id="review">Review consent ↑</button><button class="primary disabled" disabled>Ask the Ball</button>';c.querySelector('#review').onclick=reviewConsent;}
  if(variant==='b'){c.innerHTML=subject+notice+field+'<button class="primary" id="review">Review AI consent</button>';c.querySelector('#review').onclick=reviewConsent;}
  if(variant==='c'){c.innerHTML='<p class="caption">Before your first question</p>'+permission+'<button class="primary disabled" disabled id="continue">Continue to question</button><button class="quiet" data-study>Not now</button>';c.querySelector('#permission').onchange=e=>{const b=c.querySelector('.primary');b.disabled=!e.target.checked;b.classList.toggle('disabled',!e.target.checked);};c.querySelector('#continue').onclick=composer;bind();}
 }else{
  c.innerHTML='<div class="release-stage"><div class="release-art '+variant+'"><div class="core"></div>'+(variant==='c'?'<div class="whole">'+art+'</div><div class="mist"></div>':'<div class="part left">'+art+'</div><div class="part right">'+art+'</div><div class="bottom"><div>'+art+'</div></div><div class="seam"></div>')+'<div class="ring"></div></div></div><button class="quiet" id="show">Show forecast</button>';c.querySelector('#show').onclick=payoff;
  if(q.has('time')){const t=Number(q.get('time'));if(t>=1100){payoff();for(const a of document.getAnimations()){a.pause();a.currentTime=t-1100;}}else for(const a of document.getAnimations()){a.pause();a.currentTime=t;}}
  else timer=setTimeout(payoff,1100);
 }
}
document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>{variant=b.dataset.variant;render()});document.querySelector('#scene').onchange=e=>{scene=e.target.value;render()};document.querySelector('#large').onclick=()=>{large=!large;render()};document.querySelector('#play').onclick=render;render();
</script></html>

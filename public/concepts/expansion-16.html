<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open mist · forms and evidence</title>
<style>
@font-face{font-family:Fell;src:url(study-assets/display.woff2)}@font-face{font-family:Hanken;src:url(study-assets/body.woff2)}*{box-sizing:border-box}html{background:#100c09;color:#f1e9dc;font-family:Hanken,sans-serif;font-size:16px}body{margin:0;background:radial-gradient(ellipse at 85% 90%,#4d341c66,transparent 62%);min-height:100vh}body.large{font-size:32px}main{max-width:390px;margin:auto;padding:24px;min-height:100vh}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0 24px;font-size:.875em}header button{min-width:44px}h1,h2,.quote{font-family:Fell,serif;font-weight:400}h1{font-size:1.75em;line-height:1.18;margin:16px 0}h2{font-size:1.35em;line-height:1.3;margin:16px 0}.quote{font-size:1.375em;line-height:1.3;margin:14px 0}p{line-height:1.55;margin:12px 0}button,select,input,textarea{font:inherit;color:inherit}button,a,summary{touch-action:manipulation}button,select{min-height:48px}button{background:none;border:0;cursor:pointer;padding:12px 0;text-align:left}button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #e0a458;outline-offset:4px}label{display:block}.small{font-size:.875em;line-height:1.45;color:#b9ab97}.gold{color:#e0a458}.rule{border-bottom:1px solid #614c3466;padding:16px 0}.primary{display:block;text-align:center;width:100%;padding:14px 18px;background:#ebd5b0;color:#120e0b;border-radius:28px;box-shadow:0 3px #7a5527;min-height:54px;font-weight:600;margin:14px 0}.quiet{display:block;width:100%;border-bottom:1px solid #614c3466;margin-top:8px;text-align:center}input,textarea,select{display:block;width:100%;border:0;border-bottom:1px solid #79634a;background:transparent;padding:14px 0;border-radius:0;margin:6px 0 14px}textarea{font-family:Fell,serif;font-size:1.5em;line-height:1.3;resize:vertical;min-height:5.6em}select{appearance:auto}option{background:#120e0b}fieldset{border:0;padding:0;margin:0 0 16px}legend{font-size:.875em;color:#b9ab97;margin-bottom:6px}.choices{display:flex;gap:20px}.choices label{display:flex;align-items:center;gap:10px;flex:1;min-height:52px;border-bottom:1px solid #614c34}.choices input{appearance:none;flex:0 0 20px;width:20px;height:20px;padding:0;margin:0;border:1px solid #79634a;border-radius:50%}.choices input:checked{background:#e0a458;box-shadow:inset 0 0 0 4px #120e0b}.large .choices{flex-direction:column;gap:0}.fixed-action{position:sticky;bottom:0;background:linear-gradient(transparent,#120e0b 14%);padding:14px 0 4px;margin-top:12px}.context{display:flex;align-items:center;gap:12px}.context span{flex:1}.context button{color:#e0a458;flex-shrink:0}details{border-bottom:1px solid #614c3466;padding:14px 0}summary{min-height:48px;cursor:pointer;line-height:1.4}.section-nav{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin:16px 0}.section-nav a,.section-nav button{min-width:0;min-height:48px;color:#e0a458;text-decoration:none;border-bottom:1px solid #614c34;padding:12px 0;overflow-wrap:anywhere}.section-nav button[aria-pressed=true]{border-color:#e0a458;color:#f1e9dc}.reader{font-size:1.0625em;line-height:1.5}.reader p{white-space:pre-wrap;overflow-wrap:anywhere}.source{display:block;color:#e0a458;overflow-wrap:anywhere;padding:12px 0;text-decoration:none}.section{padding:8px 0 20px;border-bottom:1px solid #614c3466;scroll-margin-top:12px}.library button{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;border-bottom:1px solid #614c3466;padding:20px 0}.library strong{font-weight:400}.library small{display:block;color:#b9ab97;font-size:.875em;margin-top:6px}.orb-mark{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#f1e9dc 0 3%,#b2915755 9%,#23190f 52%,#775b36 70%,#140e08 76%);border:1px solid #9c7b4f;flex-shrink:0}#study{max-width:390px;margin:24px auto;padding:16px;color:#b9ab97;font-size:14px}#study a{color:#e0a458;margin-right:10px}#status{line-height:1.4;color:#e0a458}.large .context{flex-wrap:wrap}.large header{margin-bottom:16px}
</style><main id="app"></main><aside id="study"></aside>
<script>
const params=new URLSearchParams(location.search),variant=params.get('variant')||'a',screen=params.get('screen')||'ask',large=params.get('large')==='1';document.body.classList.toggle('large',large);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const question='Will Alex learn Spanish this year?';let subject='someone',person='Alex',draft=question,section='reason',editingIdentity=false,detail=false;
const prediction={"id":"layout-fixture","question":"Will I be conversational in Spanish in six months?","headline":"By spring you will hold a twenty-minute conversation in Spanish","createdAt":"2026-10-02T10:53:50.818Z","label":"Speculative · moderate confidence","why":"Recorded context: I practise with a conversation partner after work and review difficult phrases every weekend. I practise with a conversation partner after work and review difficult phrases every weekend. I practise with a conversation partner after work and review difficult phrases every weekend. I practise with a  This scenario assumes You keep making time for regular practice and feedback even when your weekly schedule changes. You keep making time for regular practice and feedback even when your weekly schedule changes. You keep m Dated news headlines below add background; they do not verify this prediction.","facts":{"context_a":"I practise with a conversation partner after work and review difficult phrases every weekend. I practise with a conversation partner after work and review difficult phrases every weekend. I practise with a conversation partner after work and review difficult phrases every weekend. I practise with a ","context_b":"I practise with a conversation partner after work and review difficult phrases every weekend. I practise with a conversation partner after work and review difficult phrases every weekend. I practise with a conversation partner after work and review difficult phrases every weekend. I practise with a ","context_c":"I practise with a conversation partner after work and review difficult phrases every weekend. I practise with a conversation partner after work and review difficult phrases every weekend. I practise with a conversation partner after work and review difficult phrases every weekend. I practise with a "},"sources":[{"title":"Layout source 1: Language learners describe sustained practice, changing schedules and community conversation groups. Language learners describe sustained practice, changing schedules and community conversation groups. Language learners describe sustained practice, changing schedules and community conversation groups. Language learners describe sustained practice, changing schedules and community conversation grou","url":"https://example.com/layout-source-1","date":"2026-10-01","publisher":"Synthetic international language and education research publication"},{"title":"Layout source 2: Language learners describe sustained practice, changing schedules and community conversation groups. Language learners describe sustained practice, changing schedules and community conversation groups. Language learners describe sustained practice, changing schedules and community conversation groups. Language learners describe sustained practice, changing schedules and community conversation grou","url":"https://example.com/layout-source-2","date":"2026-10-01","publisher":"Synthetic international language and education research publication"},{"title":"Layout source 3: Language learners describe sustained practice, changing schedules and community conversation groups. Language learners describe sustained practice, changing schedules and community conversation groups. Language learners describe sustained practice, changing schedules and community conversation groups. Language learners describe sustained practice, changing schedules and community conversation grou","url":"https://example.com/layout-source-3","date":"2026-10-01","publisher":"Synthetic international language and education research publication"}],"assumptions":["You keep making time for regular practice and feedback even when your weekly schedule changes. You keep making time for regular practice and feedback even when your weekly schedule changes. You keep m"],"friend":false};
const header='<header><button aria-label="Close study">×</button><span class="small">Crystal Ball</span></header>';
const sections=[['reason','Why this forecast'],['answers','Your answers'],['assumptions','Assumptions'],['sources','Current sources']];
const paragraphs=s=>String(s).split(/\n\s*\n/).map(p=>'<p>'+esc(p)+'</p>').join('');
function content(key){if(key==='reason')return paragraphs(prediction.deeperWhy||prediction.why);if(key==='answers')return Object.entries(prediction.facts).map(([k,v])=>'<div class="section"><p class="small gold">'+esc(k.replaceAll('_',' '))+'</p>'+paragraphs(v)+'</div>').join('');if(key==='assumptions')return prediction.assumptions.map(paragraphs).join('');return prediction.sources.length?prediction.sources.map(s=>'<a class="source" href="'+esc(s.url)+'">'+esc(s.title)+'</a><p class="small">'+esc(s.date+' · '+s.publisher)+'</p>').join(''):'<p>No relevant current sources found.</p>'}
function identity(){return '<fieldset><legend>Question about</legend><div class="choices"><label><input type="radio" name="subject" value="myself" '+(subject==='myself'?'checked':'')+'>Myself</label><label><input type="radio" name="subject" value="someone" '+(subject==='someone'?'checked':'')+'>Someone</label></div></fieldset>'+(subject==='someone'?'<label class="small" for="person">First name</label><input id="person" value="'+esc(person)+'" maxlength="40"><p class="small">For fun. The Ball knows nothing about them; nobody is notified.</p>':'')}
function questionInput(){return '<label class="small" for="question">Your question</label><textarea id="question" rows="4" maxlength="500">'+esc(draft)+'</textarea>'}
const disclosure='<p class="small">For entertainment. Questions and answers go to your prediction engine.</p>';
const submit='<button class="primary" id="submit">Ask the Ball</button><p id="status" role="status"></p>';
function draw(){let body=header;
if(screen==='ask'){
 if(variant==='a')body+='<h1>Ask the Ball</h1>'+identity()+questionInput()+disclosure+'<div class="fixed-action">'+submit+'</div><button class="quiet">Speak instead</button>';
 if(variant==='b')body+=editingIdentity?'<p class="small">Before your question</p><h1>Who’s on your mind?</h1>'+identity()+'<button id="continue" class="primary">Continue to question</button>':'<div class="context rule"><span class="small">'+(subject==='someone'?'About '+esc(person):'About myself')+'</span><button id="change">Change</button></div><h1>What do you wonder?</h1>'+questionInput()+disclosure+'<div class="fixed-action">'+submit+'</div><button class="quiet">Speak instead</button>';
 if(variant==='c')body+='<div class="context"><div class="orb-mark" aria-hidden="true"></div><h1>Ask the Ball</h1></div>'+questionInput()+'<details id="identity"><summary>About '+(subject==='someone'?esc(person):'myself')+' · change</summary>'+identity()+'</details>'+disclosure+submit+'<button class="quiet">Speak instead</button>';
}else{
 if(variant==='a')body+='<p class="small gold">Behind the mist</p><p class="quote">'+esc(prediction.headline)+'</p><p class="small">'+esc(prediction.label)+'</p><nav class="section-nav" aria-label="Evidence sections">'+sections.map(([k,t])=>'<a href="#'+k+'">'+t+'</a>').join('')+'</nav>'+sections.map(([k,t])=>'<section class="section" id="'+k+'"><h2>'+t+'</h2><div class="reader">'+content(k)+'</div></section>').join('');
 if(variant==='b')body+='<p class="small gold">Behind the mist</p><details><summary>Your forecast</summary><p class="quote">'+esc(prediction.headline)+'</p><p class="small">'+esc(prediction.label)+'</p></details><nav class="section-nav" aria-label="Evidence sections">'+sections.map(([k,t])=>'<button data-section="'+k+'" aria-pressed="'+(k===section)+'">'+t+'</button>').join('')+'</nav><section class="reader" aria-live="polite"><h2>'+sections.find(s=>s[0]===section)[1]+'</h2>'+content(section)+'</section>';
 if(variant==='c')body+=detail?'<button id="overview" class="gold">‹ All evidence</button><h1>'+sections.find(s=>s[0]===section)[1]+'</h1><div class="reader">'+content(section)+'</div>':'<p class="small gold">Behind the mist</p><p class="quote">'+esc(prediction.headline)+'</p><p class="small">'+esc(prediction.label)+'</p><div class="library">'+sections.map(([k,t])=>'<button data-detail="'+k+'"><span><strong>'+t+'</strong><small>'+({reason:'Read the scenario and its limits',answers:Object.keys(prediction.facts).length+' details you supplied',assumptions:prediction.assumptions.length+' scenario conditions',sources:prediction.sources.length+' background sources'}[k])+'</small></span><span aria-hidden="true">›</span></button>').join('')+'</div>';
 body+='<button class="quiet">Back to forecast</button>';
}
document.querySelector('#app').innerHTML=body;
document.querySelector('#question')?.addEventListener('input',e=>draft=e.target.value);document.querySelector('#person')?.addEventListener('input',e=>person=e.target.value);
document.querySelectorAll('[name=subject]').forEach(el=>el.onchange=()=>{subject=el.value;draw()});document.querySelector('#change')?.addEventListener('click',()=>{editingIdentity=true;draw()});document.querySelector('#continue')?.addEventListener('click',()=>{editingIdentity=false;draw()});document.querySelector('#submit')?.addEventListener('click',()=>document.querySelector('#status').textContent='Layout study only. No forecast requested.');
document.querySelectorAll('[data-section]').forEach(el=>el.onclick=()=>{section=el.dataset.section;draw()});document.querySelectorAll('[data-detail]').forEach(el=>el.onclick=()=>{section=el.dataset.detail;detail=true;draw();scrollTo(0,0)});document.querySelector('#overview')?.addEventListener('click',()=>{detail=false;draw();scrollTo(0,0)});
}
draw();document.querySelector('#study').innerHTML='Throwaway layout study · '+screen+' '+variant.toUpperCase()+'<p>All variants preserve content. Engine, export and native behavior are not implemented.</p>'+['a','b','c'].map(v=>'<a href="?screen='+screen+'&variant='+v+'&large='+(large?1:0)+'">'+v.toUpperCase()+'</a>').join('')+'<a href="?screen='+(screen==='ask'?'why':'ask')+'&variant='+variant+'">'+(screen==='ask'?'Why':'Ask')+'</a><a href="?screen='+screen+'&variant='+variant+'&large='+(large?0:1)+'">'+(large?'Normal':'200%')+'</a>';
if(params.has('capture'))document.querySelector('#study').remove();
</script></html>

name: Prototype checks
# Manual-only: the account's GitHub Actions billing is paused, so verification
# runs locally through the verify-crystal-ball skill on the exact head.
on: workflow_dispatch
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx expo export --platform web

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open mist · Focused tasks</title><link rel="stylesheet" href="study-assets/orb.css"><style>
@font-face{font-family:Fraunces;src:url(font-assets/fraunces-static.ttf)}@font-face{font-family:Manrope;src:url(font-assets/manrope-static.ttf)}@font-face{font-family:Wordmark;src:url(font-assets/wordmark.woff2)}*{box-sizing:border-box}body{margin:0;background:#100c09;color:#f1e9dc;font:16px/1.5 Manrope,system-ui}aside{max-width:800px;margin:auto;padding:24px}aside h1{font:26px Fraunces}aside p{color:#b9ab97}button,select{font:inherit;color:inherit;background:transparent;border:0;cursor:pointer;min-height:48px;padding:10px 0;text-align:left}select{border:1px solid #79634a;border-radius:8px;padding:10px;max-width:100%}.controls{display:flex;gap:16px;flex-wrap:wrap}button:focus-visible,select:focus-visible{outline:2px solid #f2c284;outline-offset:3px}.phone{width:100%;max-width:390px;height:844px;margin:auto;position:relative;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(ellipse at 80% 100%,#3b281955,transparent 65%),#100c09;font-size:16px}.phone.large{font-size:32px}.content{flex:1;min-height:0;overflow:auto;padding:20px 24px 28px;overflow-wrap:break-word}.capture aside{display:none}.capture .phone{height:100vh;max-width:none}h1,h2{font-family:Fraunces;font-weight:400;margin:12px 0}h1{font-size:1.375em;line-height:1.3}h2{font-size:1.1875em;line-height:1.4}p{margin:12px 0}.caption{font-size:.875em;line-height:1.45;color:#b9ab97}.gold{color:#e0a458}.back{color:#f2c284;margin-bottom:12px}.row{display:block;width:100%;border-bottom:1px solid #614c3466;padding:16px 0;color:#f2c284}.primary{display:block;width:100%;padding:14px 18px;margin-top:16px;border-radius:27px;background:#ebd5b0;box-shadow:0 3px #7a5527;color:#120e0b;text-align:center;font-weight:600}.choice{display:flex;align-items:center;gap:14px;width:100%;padding:14px 0;border-bottom:1px solid #614c3466}.choice i{width:22px;height:22px;flex-shrink:0;border:2px solid #b9ab97;border-radius:50%}.choice[aria-pressed=true]{color:#e0a458}.choice[aria-pressed=true] i{background:#e0a458;b </style><aside><h1>Focused reading, check-in and daily omen</h1><div class="controls"><select id="scene"><option value="evidence">Reading details</option><option value="checkin">Check-in</option><option value="home">Home · unavailable omen</option></select><select id="variant"><option value="a">A</option><option value="b">B</option><option value="c">C</option></select><button id="scale">200% text</button></div><p id="tradeoff"></p><p>Throwaway layout comparison. No model calls, saved outcomes or changed daily allowance.</p></aside><main class="phone"></main><script type="module">
const q=new URLSearchParams(location.search),scene=q.get('scene')||'evidence',v=q.get('variant')||'a',large=q.get('large')==='1',phone=document.querySelector('.phone');phone.classList.toggle('large',large);document.body.classList.toggle('capture',q.has('capture'));for(const key of ['scene','variant']){document.querySelector('#'+key).value=key==='scene'?scene:v;document.querySelector('#'+key).onchange=e=>{q.set(key,e.target.value);location.search=q}}document.querySelector('#scale').onclick=()=>{q.set('large',large?'0':'1');location.search=q};
const forecast='You will be conversational in Spanish in six months.',qualifier='Speculative forecast · not a guarantee',policy='Today’s free omen attempt is used, even when no omen is saved. Try tomorrow. This is separate from your reading balance.',sections=[['reason','Why this forecast','<p class="caption">This explanation was saved with your reading.</p>'+Array.from({length:4},()=>'<p class="copy">Weekly practice creates opportunities to speak. Your available time and feedback could change, so this describes a possible scenario rather than a guaranteed result.</p>').join('')],['answers','Your answers','<p class="caption">How often do you speak Spanish?</p><p class="copy">A weekly class and practice with a friend.</p><p class="caption">Time horizon</p><p class="copy">Six months.</p>'],['assumptions','Assumptions','<p class="copy">Your weekly practice continues at the frequency you supplied.</p>'],['sources','Background sources','<p class="copy">No current background sources were recorded. The explanation is speculative.</p>']],back='<button class="back">‹ Forecast</button>';
let selected=null,choice='',saved=false;const details='<details class="rule"><summary>Your original question</summary><p>Will I be conversational in Spanish in six months?</p></details>',reference='<h2>'+forecast+'</h2><p class="caption">'+qualifier+'</p>',choices=()=>['Came true','Did not happen','Still waiting'].map((label,i)=>'<button class="choice" data-choice="'+i+'" aria-pressed="'+(choice===String(i))+'"><i></i><span>'+label+'</span></button>').join(''),save=()=>'<p class="save-status" id="status">'+(saved?'Outcome saved in this prototype.':choice?'Not saved yet.':'Choose an outcome.')+'</p><button class="primary" id="save" '+(!choice?'disabled':'')+'>Save outcome</button>';
function bindSave(){document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{choice=b.dataset.choice;saved=false;render()});if(document.querySelector('#save'))document.querySelector('#save').onclick=()=>{saved=true;render()}}
function render(){let body='',trade='';
if(scene==='evidence'){
 if(v==='a'){trade='Slim readers: one return and one heading bring content forward; switching sections requires returning to the index.';body='<div class="content">'+(selected?'<button class="back" id="sections">‹ Reading details</button><h1>'+selected[1]+'</h1>'+selected[2]+'<button class="row" id="reader-end">Back to reading details</button>':back+'<h1>Reading details</h1>'+sections.map(([id,title])=>'<button class="row" data-open="'+id+'">'+title+' ›</button>').join(''))+'</div>'}
 if(v==='b'){trade='Section selector: one compact control switches content; a native menu hides the full set of choices.';selected=selected||sections[0];body='<div class="content">'+back+'<label class="label" for="section-picker">Reading details</label><select id="section-picker" class="section-select">'+sections.map(([id,title])=>'<option value="'+id+'" '+(selected[0]===id?'selected':'')+'>'+title+'</option>').join('')+selected[2]+'</div>'}
 if(v==='c'){trade='Closed accordions: all sections are visible initially and one opens in place; long content separates the remaining choices.';body='<div class="content">'+back+'<h1>Reading details</h1>'+sections.map(([id,title,content])=>'<details class="section" data-section="'+id+'" '+(selected?.[0]===id?'open':'')+'><summary>'+title+'</summary>'+content+'</details>').join('')+'</div>'}
}
if(scene==='checkin'){
 if(v==='a'){trade='Forecast-first form: the exact forecast stays beside outcome choices; long forecasts push Save lower.';body='<div class="content">'+back+'<h1>Check-in</h1>'+reference+choices()+save()+details+'</div>'}
 if(v==='b'){trade='Two-step check-in: read the forecast first, then answer with a reference disclosure; completing requires an extra step.';body='<div class="content">'+(selected?'<button class="back" id="overview">‹ Check-in</button><h1>What happened?</h1><details><summary>View forecast</summary>'+reference+'</details>'+choices()+save():back+'<h1>Check-in</h1>'+reference+'<button class="primary" id="open-outcomes">Record outcome</button>'+details)+'</div>'}
 if(v==='c'){trade='Outcome sheet: Save stays reachable while forecast and choices scroll together; it temporarily covers the reading.';body='<div class="content">'+back+'<h1>Check-in</h1>'+reference+'<button class="primary" id="open-outcomes">Record outcome</button>'+details+'</div>'+(selected?'<div class="sheet"><div class="content"><button class="back" id="overview">‹ Close check-in</button><h1>What happened?</h1>'+reference+choices()+'</div><div class="footer">'+save()+'</div></div>':'')}
}
if(scene==='home'){
 const art=window.orbArt||'',header='<div class="header"><span class="brand">Crystal Ball</span><span class="balance">1 reading</span></div>',hero=art+'<h1 class="home-title">Touch the ball.</h1><p class="caption" style="text-align:center">For fun. Not a guarantee.</p>',label='<p class="caption gold">Today’s omen · free</p>';
 if(v==='a'){trade='Direct status in the scroll flow: the used attempt and return date are explicit; enlarged text needs more Home scrolling.';body=header+'<div class="content">'+hero+'<section class="rule">'+label+'<p>Omen unavailable.</p><p class="status">Free attempt used. Try tomorrow.</p><details><summary>About the daily omen</summary><p class="policy">'+policy+'</p></details></section></div>'}
 if(v==='b'){trade='Compact status row: the allowance consequence is visible with a separate details action; narrow layouts require wrapping.';body=header+'<div class="content">'+hero+'<section class="rule">'+label+'<p>Omen unavailable.</p><div class="split"><p class="status">Free attempt used.<br>Try tomorrow.</p><button class="row" id="omen-details">Details ›</button></div></section></div>'}
 if(v==='c'){trade='Daily-omen destination: a short Home summary opens the complete state; the full policy takes an extra action.';body=header+'<div class="content">'+hero+'<section class="rule">'+label+'<button class="row" id="omen-details">Unavailable · try tomorrow ›</button><p class="caption">Today’s free attempt is used.</p></section></div>'}
 body+='<div class="nav"><span>Home</span><span>Sky</span><span>Ask</span><span>History</span><span>You</span></div>';
 if(selected)body+='<div class="sheet"><div class="content"><h1>Today’s omen</h1><p>Omen unavailable.</p><p class="policy">'+policy+'</p></div><div class="footer"><button class="primary" id="omen-close">Done</button></div></div>';
}
phone.innerHTML=body;document.querySelector('#tradeoff').textContent=trade;
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{selected=sections.find(s=>s[0]===b.dataset.open);render()});for(const id of ['sections','reader-end','overview','omen-close'])if(document.querySelector('#'+id))document.querySelector('#'+id).onclick=()=>{selected=null;render()};if(document.querySelector('#section-picker'))document.querySelector('#section-picker').onchange=e=>{selected=sections.find(s=>s[0]===e.target.value);render()};document.querySelectorAll('[data-section]').forEach(el=>el.ontoggle=()=>{if(el.open)document.querySelectorAll('[data-section]').forEach(other=>{if(other!==el)other.open=false})});for(const id of ['open-outcomes','omen-details'])if(document.querySelector('#'+id))document.querySelector('#'+id).onclick=()=>{selected=true;render()};if(scene==='checkin')bindSave();}
if(scene==='home')window.orbArt=await fetch('study-assets/orb.json').then(r=>r.json());render();
</script></html>

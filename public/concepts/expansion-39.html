</style><aside><h1>Reading tasks · throwaway comparison</h1><p>Same mist and fonts; three approaches to writing, evidence and sharing. Controls illustrate layout only.</p><div class="controls"><select id="scene"><option value="editor">Question composer</option><option value="evidence">Reading details</option><option value="share">Share</option></select><select id="variant"><option value="a">A</option><option value="b">B</option><option value="c">C</option></select><button id="scale">200% text</button><button id="height">Short viewport</button></div><p id="tradeoff"></p></aside><main class="phone" id="phone"></main><script>
const q=new URLSearchParams(location.search),scene=q.get('scene')||'editor',variant=q.get('variant')||'a',large=q.get('large')==='1',short=q.get('short')==='1';document.body.classList.toggle('capture',q.has('capture'));const phone=document.querySelector('#phone');phone.classList.toggle('large',large);phone.classList.toggle('short',short);document.querySelector('#scene').value=scene;document.querySelector('#variant').value=variant;function change(k,v){q.set(k,v);location.search=q}document.querySelector('#scene').onchange=e=>change('scene',e.target.value);document.querySelector('#variant').onchange=e=>change('variant',e.target.value);document.querySelector('#scale').onclick=()=>change('large',large?'0':'1');document.querySelector('#height').onclick=()=>change('short',short?'0':'1');
const title='What would you like to know?',draft='I can protect time for a weekly creative practice, ask a friend for feedback, and keep notes about each attempt. '.repeat(2),forecast='You will be conversational in Spanish in six months.',qualifier='Speculative forecast · not a guarantee',nav='<button class="back">‹ Back</button>',button='<button class="primary" id="action">Continue</button>',label='<label class="field" for="answer">Your answer</label>',field='<textarea id="answer" class="editor">'+draft+'</textarea>',head='<h1>'+title+'</h1>',image='<img class="story" src="expansion-39-assets/story.png" alt="Complete forecast image">';
let content='',trade='';
if(scene==='editor'){
 const question='What would you like to know?',value='Will I make time for pottery practice this winter while balancing work and other commitments?',entry='<label class="field" for="answer">Your question</label><textarea id="answer" class="editor">'+value+'</textarea>',expand='<button class="quiet" id="expand">Expand editor ↗</button>',ask='<button class="primary" id="action">Ask the Ball</button>';
 if(variant==='a'){trade='Four-line field with Expand: compact starting point; long writing moves into a focused editor.';content='<div class="content">'+nav+'<h1>'+question+'</h1>'+entry+'<p class="hint">Scroll within your question, or expand to write.</p>'+expand+ask+'</div>'}
 if(variant==='b'){trade='Dedicated question step: writing gets the full screen; less context is visible while editing.';content='<div class="header compact-header">'+nav+'<span class="caption">Your question</span></div><div class="full"><h1>'+question+'</h1>'+entry+'</div><div class="sticky">'+ask+'</div>'}
 if(variant==='c'){trade='Prompts plus short field: easier starting point; suggestions can distract from a personal question.';content='<div class="content">'+nav+'<h1>'+question+'</h1><p class="caption">Start with a prompt, or write your own.</p><button class="quiet prompt">Will I make progress with…</button><button class="quiet prompt">What could change about…</button>'+entry+expand+ask+'</div>'}
}

const missing='<p class="bodycopy">No separate assumptions were recorded for this reading.</p>',reason='<p class="caption">Preserved explanation</p><p class="bodycopy">Weekly speaking practice could build familiarity. Progress depends on the time you can give it and the feedback available.</p>',answers='<p class="caption">What have you tried?</p><p class="bodycopy">A weekly class.</p><p class="caption">Additional recorded detail · original label unavailable</p><p class="bodycopy">An hour each week.</p>',sources='<p class="bodycopy">No current background sources were recorded.</p>';
if(scene==='evidence'){
 if(variant==='a'){trade='Continuous document: no navigation between facts; more scrolling.';content='<div class="content">'+nav+'<h1>Reading details</h1><p class="caption">'+qualifier+'</p>'+[['Why this forecast',reason],['Your answers',answers],['Assumptions',missing],['Sources',sources]].map(([h,b])=>'<section class="section"><h2>'+h+'</h2>'+b+'</section>').join('')+'</div>'}
 if(variant==='b'){trade='Focused reader: one section at a time; choosing a section adds navigation.';content='<div class="content">'+nav+'<h1>Reading details</h1><label class="field" for="section">Section</label><select id="section" style="width:100%"><option>Assumptions</option><option>Why this forecast</option><option>Your answers</option><option>Sources</option></select><p class="caption">'+qualifier+'</p><div id="reader">'+missing+'</div></div>'}
 if(variant==='c'){trade='Disclosed document: missing data visible immediately; opening multiple sections lengthens the page.';content='<div class="content">'+nav+'<h1>Reading details</h1><p class="caption">'+qualifier+'</p><div class="section"><h2>Assumptions</h2>'+missing+'</div>'+[['Why this forecast',reason],['Your answers',answers],['Sources',sources]].map(([h,b])=>'<details class="section"><summary>'+h+'</summary>'+b+'</details>').join('')+'</div>'}
}
if(scene==='share'){
 const copy='<div class="section"><p class="caption">Image text</p><h2>'+forecast+'</h2><p class="caption">'+qualifier+'</p></div>',download='<button class="primary" id="action">Download image</button>';
 if(variant==='a'){trade='Image first: complete portrait clearly visible; primary action requires scrolling.';content='<div class="content">'+nav+'<h1>Share your glimpse</h1><p class="caption">Only the forecast is included.</p>'+image+download+'</div>'}
 if(variant==='b'){trade='Action first: export is near the top and text readable; preview itself is small.';content='<div class="content">'+nav+'<h1>Share your glimpse</h1><div class="row"><div class="mini">'+image+'</div><div style="flex:1">'+download+'<p class="hint">Only the forecast.</p></div></div>'+copy+'<button class="quiet" id="inspect">View full image ›</button><div id="expanded"></div></div>'}
 if(variant==='c'){trade='Text first: forecast is immediately readable; image composition is behind a disclosure.';content='<div class="content">'+nav+'<h1>Share your glimpse</h1>'+copy+download+'<details class="section"><summary>View complete image</summary>'+image+'</details></div>'}
}
phone.innerHTML=content;document.querySelector('#tradeoff').textContent=trade;
if(document.querySelector('#expand'))document.querySelector('#expand').onclick=()=>{const original=document.querySelector('#answer'),overlay=document.createElement('div');overlay.className='editor-sheet';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label','Edit your question');overlay.innerHTML='<div class="header compact-header"><button class="back" id="cancel-editor">Cancel</button><button class="back" id="done-editor">Done</button></div><div class="full"><h1>Your question</h1><label class="field" for="expanded-answer">Edit question</label><textarea id="expanded-answer"></textarea></div>';phone.append(overlay);const field=overlay.querySelector('textarea');field.value=original.value;field.focus();overlay.querySelector('#cancel-editor').onclick=()=>{overlay.remove();document.querySelector('#expand').focus()};overlay.querySelector('#done-editor').onclick=()=>{original.value=field.value;overlay.remove();document.querySelector('#expand').focus()};};
document.querySelectorAll('.prompt').forEach(button=>button.onclick=()=>{document.querySelector('#answer').value=button.textContent;document.querySelector('#answer').focus()});
if(document.querySelector('#section'))document.querySelector('#section').onchange=e=>document.querySelector('#reader').innerHTML=({'Assumptions':missing,'Why this forecast':reason,'Your answers':answers,'Sources':sources})[e.target.value];
if(document.querySelector('#inspect'))document.querySelector('#inspect').onclick=()=>document.querySelector('#expanded').innerHTML=image;
if(document.querySelector('#action'))document.querySelector('#action').onclick=()=>{document.querySelector('#action').textContent='Prototype only';};
</script></html>

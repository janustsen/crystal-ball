<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apothecary plan comparison</title><style>
@font-face{font-family:Fell;src:url(witch-assets/imfellenglishsc.ttf)}@font-face{font-family:Caudex;src:url(witch-assets/caudex.ttf)}*{box-sizing:border-box}body{margin:0;background:#140d08;color:#f4e4cd;font:16px/1.45 Caudex,serif;text-align:center}h1,h2,button{font-weight:400}h1,h2{font-family:Fell}h1{font-size:26px;margin:8px 0}h2{font-size:22px}header{padding:14px;max-width:430px;margin:auto}header p{font-size:13px;color:#d9b98c}button{font:inherit;color:inherit;cursor:pointer;min-height:44px;border:0}nav{display:flex;justify-content:center;gap:8px}nav button{background:#352417;padding:8px;font-size:14px}nav button[aria-pressed=true]{color:#ffcf8e;text-decoration:underline;text-underline-offset:5px}.room{max-width:430px;min-height:760px;margin:auto;padding:22px 24px 40px;background:linear-gradient(#130b07c9,#130b07e6),url(witch-assets/art/b-backdrop@2x.webp) center/cover}.room p{margin:8px 0}.small{font-size:14px;color:#dbbf96}.paper{margin:20px 0 12px;background:#e0cda6;color:#302013;padding:20px 22px;border-image:url(witch-assets/art/b-panel@2x.webp) 65 90 fill / 12px 15px;clip-path:polygon(1% 1%,26% 0,63% 1%,99% 0,100% 98%,64% 100%,30% 99%,0 100%)}.choice{background:transparent;display:block;width:100%;padding:12px 6px}.planline{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:12px}.choice strong{display:block;font-family:Fell;font-size:24px;font-weight:400}.choice .interval{font-size:14px}.choice[aria-checked=true]{background:#bda07940;box-shadow:inset 0 0 0 2px #876035}.choice:focus-visible{outline:3px solid #70401b;outline-offset:-4px}.divider{color:#947044;margin:0}.terms{font-size:14px;padding:12px 0 0}.wood{width:100%;margin-top:14px;padding:18px 20px;background:linear-gradient(#392519a6,#24170dd9),url(witch-assets/wood-table.jpg) center/cover;color:#ffdda8;font-family:Fell;font-size:20px;box-shadow:inset 0 2px #b48a5a88,inset 0 -7px #100704;clip-path:polygon(1% 3%,24% 0,54% 1%,99% 2%,100% 98%,75% 100%,32% 99%,0 98%)}.drawers </style><header><h2>Plan hierarchy study</h2><p id="note"></p><nav><button data-view="ledger">Ledger</button><button data-view="drawers">Drawers</button><button data-view="bottles">Bottles</button></nav><button id="scale" style="background:transparent;font-size:14px">200% text</button></header><main class="room"><h1>More glimpses.</h1><p class="small">Test mode · no real payments</p><p>10 readings daily · deeper Why</p><div class="paper" role="radiogroup" aria-label="Plan"></div><p class="terms" id="terms"></p><button class="wood" id="commit">Simulate monthly Plus</button><p class="small">Cancel anytime in your app store’s subscription settings.</p><p class="small">Demo only: no charge or renewal.</p><p class="small">Free: 1 daily reading, saved forecasts and check-ins.</p></main><script>
const plans=[{id:'weekly',name:'Weekly',price:'$1.99',interval:'each week',terms:'$103.48/yr (52 weeks) · renews weekly until canceled'},{id:'monthly',name:'Monthly',price:'$5.99',interval:'each month',terms:'Renews monthly until canceled'},{id:'annual',name:'Yearly',price:'$39.99',interval:'each year',terms:'Save 44% vs monthly · renews yearly until canceled'}];let selected='monthly';const params=new URLSearchParams(location.search);let view=params.get('view')||'ledger',large=params.get('large')==='1';function draw(){document.querySelector('main').className=`room ${view} ${large?'large':''}`;document.querySelector('#note').textContent={ledger:'One page compares prices; selected terms stay beside the commitment.',drawers:'Distinct slots feel physical, but give every choice primary-action weight.',bottles:'Most visual; decorative height makes enlarged comparisons slower.'}[view];document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));document.querySelector('.paper').innerHTML=plans.map((p,i)=>`${i?'<span class="divider" aria-hidden="true">✧</span>':''}<button class="choice" role="radio" aria-checked="${selected===p.id}" data-plan="${p.id}">${view==='bottles'?'<img alt="" src="witch-assets/art/b-history-jar@2x.webp">':''}<span class="planline"><span>${selected===p.id?'✓ ':''}${p.name}</span><strong>${p.price}</strong></span><span class="interval">${p.interval}</span></button>`).join('');document.querySelector('#terms').textContent=plans.find(p=>p.id===selected).terms;document.querySelector('#commit').textContent=`Simulate ${selected==='annual'?'yearly':selected} Plus`;document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{selected=b.dataset.plan;draw()})}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;draw()});document.querySelector('#scale').onclick=()=>{large=!large;draw()};draw();
</script></html>

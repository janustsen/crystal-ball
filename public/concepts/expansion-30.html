<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open mist · reading navigation</title><style>
@font-face{font-family:Fell;src:url(study-assets/display.woff2)}@font-face{font-family:Hanken;src:url(study-assets/body.woff2)}*{box-sizing:border-box}body{margin:0;background:#100c09;color:#f1e9dc;font:16px Hanken,system-ui,sans-serif}body.large{font-size:32px}main{max-width:390px;margin:auto;padding:24px 24px 120px;min-height:100vh;background:radial-gradient(ellipse at 90% 100%,#34221466,transparent 70%)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #614c3466;margin-bottom:24px}header span{font-family:Fell;font-size:1.375em}h1{font:1.75em/1.2 Fell;margin:12px 0}h2{font:1.375em/1.3 Fell;margin:12px 0}p{line-height:1.45;margin:12px 0}.muted,label{font-size:.875em;color:#b9ab97;line-height:1.45}.gold{color:#e0a458}button,input,summary{font:inherit;min-height:48px}button{color:#f1e9dc;background:none;border:0;padding:12px 0;cursor:pointer;text-align:left}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid #e0a458;outline-offset:4px}input{display:block;width:100%;background:transparent;color:#f1e9dc;border:0;border-bottom:1px solid #79634a;border-radius:0;padding:12px 0;margin:4px 0 18px}label{display:block}.primary{display:block;width:100%;text-align:center;background:#ebd5b0;color:#120e0b;border-radius:30px;padding:16px;margin:18px 0;font-weight:600}.quiet{display:block;width:100%;color:#c8dfe8;border-bottom:1px solid #614c3466}.row{border-bottom:1px solid #614c3466;padding:16px 0}.row button{display:block;color:#c8dfe8}.error{color:#f1e9dc;border-left:2px solid #e0a458;padding-left:12px;margin:8px 0 16px}.error label{color:#e0a458}.saved{padding:24px 0;border-block:1px solid #614c3466;margin:24px 0}.saved h2{margin-top:8px}.step{color:#e0a458;font-size:.875em}.progress{display:flex;gap:8px;margin:18px 0}.progress i{flex:1;height:2px;background:#614c34}.progress i.on{background:#e0a458}details{border-bottom:1px solid #614c3466;padding:12px 0}summary{cursor:pointer;padding:10px 0;color:#c8dfe8}#study{max-width:390px;margin:auto;padding:20px;font-size:14px;background:#211a13}#study a{display:inline-block;color:#e0a458;padding:10px}#status{color:#e0a458}#status:empty{display:none}.large main{padding-top:16px}.large header{margin-bottom:16px}.large .saved{padding:16px 0;margin:16px 0}.pair{display:flex;justify-content:space-between;gap:12px;align-items:center}.large .pair{display:block}
footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,390px);height:76px;display:flex;align-items:center;justify-content:space-around;background:#120e0b;border-top:1px solid #614c3466;font-size:.8125em;color:#b9ab97}.large footer{height:96px}footer span{text-align:center}footer i{display:block;font-style:normal;font-size:20px;color:#e0a458;margin-bottom:8px}</style><div id="study"></div><main id="app"></main><footer aria-hidden="true"><span><i>♙</i>Home</span><span><i>✧</i>Sky</span><span><i>◉</i>Ask</span><span><i>⌛</i>History</span><span><i>♧</i>You</span></footer><script>
const p=new URLSearchParams(location.search),variant=p.get('variant')||'a',state=p.get('state')||'reason',large=p.get('large')==='1';if(large)document.body.classList.add('large');
const fact='I practise with a conversation partner after work and review difficult phrases every weekend. '.repeat(4).slice(0,300);
const assumption='You keep making time for regular practice and feedback even when your weekly schedule changes. '.repeat(3).slice(0,200);
const headline='By spring you will hold a twenty-minute conversation in Spanish';
const reason=['Recorded context: '+fact,'This scenario assumes '+assumption,'Dated news headlines below add background; they do not verify this prediction.'];
const answers=[fact,fact,fact];
const labels=state==='reason'?['Recorded context','Scenario assumption','Limits']:['Answer 1','Answer 2','Answer 3'];
const bodies=state==='reason'?reason:answers;
const button=(s,action='study')=>`<button class="quiet" data-action="${action}">${s}</button>`;
let html='<header><span>Crystal Ball</span></header>'+button('‹ Back to forecast')+'<h1>'+(state==='checkin'?'Check-in':state==='reason'?'Why this forecast':'Your answers')+'</h1>';
const qualifier='<p class="step">Speculative · moderate confidence</p>';
if(state==='checkin'){
 const forecast='<h2>'+headline+'</h2>'+qualifier;
 const choices='<div id="choices">'+['Came true','Did not happen','Still waiting'].map((s,i)=>button(s,'outcome-'+i)).join('')+'</div><p class="muted">Choose again to change your answer. Still waiting keeps the reminder date.</p>';
 if(variant==='a')html+=forecast+'<h2>What happened?</h2>'+choices;
 if(variant==='b')html+='<p class="muted">Your Spanish conversation forecast</p><details><summary>Read the forecast</summary>'+forecast+'</details><h2>What happened?</h2>'+choices;
 if(variant==='c')html+='<h2>What happened?</h2>'+choices+'<section class="row">'+forecast+'</section>';
 html+='<p class="muted">Check-in reminder · April 1, 2027</p>'+button('Why this forecast ›')+button('Share this glimpse');
}else{
 html+=qualifier;
 if(variant==='a')html+=bodies.map((s,i)=>'<section class="row"><p class="step">'+labels[i]+'</p><p>'+s+'</p></section>').join('');
 if(variant==='b')html+='<p class="muted">Choose a section to read.</p>'+bodies.map((s,i)=>'<details><summary>'+labels[i]+'</summary><p>'+s+'</p></details>').join('');
 if(variant==='c')html+='<p class="step" id="position">1 of 3 · '+labels[0]+'</p><div class="progress">'+bodies.map((_,i)=>'<i class="'+(i===0?'on':'')+'"></i>').join('')+'</div><div id="passage"><p>'+bodies[0]+'</p></div>'+button('Next section ›','next')+button('‹ Previous section','previous');
}
html+='<p id="status" role="status"></p>';document.querySelector('#app').innerHTML=html;
let index=0;document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{if(b.dataset.action==='next'||b.dataset.action==='previous'){index=(index+(b.dataset.action==='next'?1:2))%3;document.querySelector('#position').textContent=`${index+1} of 3 · ${labels[index]}`;document.querySelector('#passage').textContent=bodies[index];document.querySelectorAll('.progress i').forEach((el,i)=>el.classList.toggle('on',i===index));document.querySelector('#position').scrollIntoView({block:'start'})}else document.querySelector('#status').textContent='Layout study only. No reading or outcome saved.'});
document.querySelector('#study').innerHTML='Open mist · navigation study. Proposed structured data is a fixture; legacy prose cannot be assigned semantic labels by guessing.<br>'+['a','b','c'].map(v=>`<a href="?variant=${v}&state=${state}&large=${large?1:0}">${v.toUpperCase()}</a>`).join('')+['reason','answers','checkin'].map(s=>`<a href="?variant=${variant}&state=${s}&large=${large?1:0}">${s}</a>`).join('')+`<a href="?variant=${variant}&state=${state}&large=${large?0:1}">Text size</a><p>A · open numbered/semantic sections: all content visible, long scroll. B · disclosure overview: fast scanning, extra taps. C · single passage/task first: less initial load, context is farther away.</p>`;if(p.has('capture'))document.querySelector('#study').remove();
</script></html>

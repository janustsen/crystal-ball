<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open mist · question entry</title><style>
@font-face{font-family:Fell;src:url(study-assets/display.woff2)}@font-face{font-family:Hanken;src:url(study-assets/body.woff2)}*{box-sizing:border-box}body{margin:0;background:#100c09;color:#f1e9dc;font:16px Hanken,system-ui,sans-serif}body.large{font-size:32px}main{max-width:390px;margin:auto;padding:24px 24px 120px;min-height:100vh;background:radial-gradient(ellipse at 90% 100%,#34221466,transparent 70%)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #614c3466;margin-bottom:24px}header span{font-family:Fell;font-size:1.375em}h1{font:1.75em/1.2 Fell;margin:12px 0}h2{font:1.375em/1.3 Fell;margin:12px 0}p{line-height:1.45;margin:12px 0}.muted,label{font-size:.875em;color:#b9ab97;line-height:1.45}.gold{color:#e0a458}button,input,summary{font:inherit;min-height:48px}button{color:#f1e9dc;background:none;border:0;padding:12px 0;cursor:pointer;text-align:left}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid #e0a458;outline-offset:4px}input{display:block;width:100%;background:transparent;color:#f1e9dc;border:0;border-bottom:1px solid #79634a;border-radius:0;padding:12px 0;margin:4px 0 18px}label{display:block}.primary{display:block;width:100%;text-align:center;background:#ebd5b0;color:#120e0b;border-radius:30px;padding:16px;margin:18px 0;font-weight:600}.quiet{display:block;width:100%;color:#c8dfe8;border-bottom:1px solid #614c3466}.row{border-bottom:1px solid #614c3466;padding:16px 0}.row button{display:block;color:#c8dfe8}.error{color:#f1e9dc;border-left:2px solid #e0a458;padding-left:12px;margin:8px 0 16px}.error label{color:#e0a458}.saved{padding:24px 0;border-block:1px solid #614c3466;margin:24px 0}.saved h2{margin-top:8px}.step{color:#e0a458;font-size:.875em}.progress{display:flex;gap:8px;margin:18px 0}.progress i{flex:1;height:2px;background:#614c34}.progress i.on{background:#e0a458}details{border-bottom:1px solid #614c3466;padding:12px 0}summary{cursor:pointer;padding:10px 0;color:#c8dfe8}#study{max-width:390px;margin:auto;padding:20px;font-size:14px;background:#211a13}#study a{display:inline-block;color:#e0a458;padding:10px}#status{color:#e0a458}#status:empty{display:none}.large main{padding-top:16px}.large header{margin-bottom:16px}.large .saved{padding:16px 0;margin:16px 0}.pair{display:flex;justify-content:space-between;gap:12px;align-items:center}.large .pair{display:block}
footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,390px);height:76px;display:flex;align-items:center;justify-content:space-around;background:#120e0b;border-top:1px solid #614c3466;font-size:.8125em;color:#b9ab97}.large footer{height:96px}footer span{text-align:center}footer i{display:block;font-style:normal;font-size:20px;color:#e0a458;margin-bottom:8px}</style><style>header{height:72px;margin-bottom:12px}header span{font:26px Fell}textarea{font:18px/26px Hanken;display:block;width:100%;color:#f1e9dc;background:transparent;border:1px solid #79634a;border-radius:12px;padding:12px;min-height:130px;resize:vertical}textarea:focus-visible{outline:2px solid #e0a458;outline-offset:3px}main{padding-bottom:32px}.large textarea{font-size:36px;line-height:52px;min-height:232px}.large header{height:80px}label{margin:8px 0}.notice{font-size:.875em;color:#b9ab97;line-height:1.45;margin:12px 0}.subject{font-size:1em;margin:0 0 8px}.review-question{font-size:1.125em;line-height:1.45}.primary{margin-top:16px}footer{display:none}@media(max-height:600px){.large textarea{height:180px;min-height:180px}textarea{height:104px;min-height:104px}main{padding-top:0}.notice{font-size:.75em}.large header{height:72px}header{margin-bottom:8px}.primary{margin-top:12px}h1{font-size:1.25em}}</style><div id="study"></div><main id="app"></main><footer aria-hidden="true"><span><i>♙</i>Home</span><span><i>✧</i>Sky</span><span><i>◉</i>Ask</span><span><i>⌛</i>History</span><span><i>♧</i>You</span></footer><script>
const p=new URLSearchParams(location.search),variant=p.get('variant')||'a',large=p.get('large')==='1';if(large)document.body.classList.add('large');
const question='Will I start learning pottery this winter?';
const button=(s,primary=false,action='study')=>`<button class="${primary?'primary':'quiet'}" data-action="${action}">${s}</button>`;
const notice='<p class="notice">For entertainment. Your question and answers are sent to generate a forecast.</p>';
const field='<label for="question">Your question</label><textarea id="question" maxlength="500">'+question+'</textarea>';
const subject=button('About myself · change ›');
const header='<header><button data-action="study" aria-label="Close">×</button><span>1 reading left</span></header>';
let html=header;
if(variant==='a')html+=subject+field+notice+button('Ask the Ball',true)+button('Speak instead');
if(variant==='b')html+=subject+'<h1>Your question</h1>'+field+button('Review question',true,'review')+button('Speak instead');
if(variant==='c')html+=subject+notice+field+button('Ask the Ball',true)+button('Speak instead');
document.querySelector('#app').innerHTML=html+'<p id="status" role="status"></p>';
function wire(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{if(b.dataset.action==='review'){const value=document.querySelector('#question').value;document.querySelector('#app').innerHTML=header+'<h1>Ready to ask?</h1><p class="review-question"></p>'+button('Edit question',false,'edit')+notice+button('Ask the Ball',true)+'<p id="status" role="status"></p>';document.querySelector('.review-question').textContent=value;wire();scrollTo(0,0)}else if(b.dataset.action==='edit')location.reload();else document.querySelector('#status').textContent='Layout study only. No question sent.'})}wire();
document.querySelector('#study').innerHTML='Open mist · short viewport composition. Prototype only.<br>'+['a','b','c'].map(v=>`<a href="?variant=${v}&large=${large?1:0}">${v.toUpperCase()}</a>`).join('')+`<a href="?variant=${variant}&large=${large?0:1}">Text size</a><p>A · compact one-screen field: direct, notice separates question/action. B · edit then review: explicit context, adds a step. C · notice before field: question beside action, earlier disclosure can scroll away.</p>`;if(p.has('capture'))document.querySelector('#study').remove();
</script></html>

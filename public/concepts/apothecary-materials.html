<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apothecary · material study</title>
<style>
@font-face{font-family:Fell;src:url(witch-assets/imfellenglishsc.ttf)}@font-face{font-family:Caudex;src:url(witch-assets/caudex.ttf)}
*{box-sizing:border-box}body{margin:0;background:#160e0a;color:#f7e5c8;font:16px/1.5 Caudex,serif;text-align:center}h1,h2,h3,button{font-family:Fell,serif;font-weight:400}h1{font-size:28px}h2{font-size:25px}h3{font-size:21px}p{margin:8px 0}header{padding:16px}nav{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}button{font-size:19px;cursor:pointer;color:inherit;border:0;background:transparent;min-height:48px;padding:10px 16px}nav button[aria-pressed=true]{text-decoration:underline;text-underline-offset:6px}button:focus-visible{outline:2px solid #ffcd83;outline-offset:-5px}.studies{display:flex;gap:24px;align-items:start;justify-content:center;padding:12px 16px 40px;flex-wrap:wrap}.study{width:390px;max-width:100%}.note{min-height:78px;font-size:14px;padding:8px 18px}.room{position:relative;isolation:isolate;min-height:740px;overflow:hidden;padding:28px 22px;background:linear-gradient(#130b08a6,#130b08cc),url(witch-assets/art/b-backdrop@2x.webp) center/cover}.room h2{margin:0 0 24px}.paper{background:#dfcaa0;border-image:url(witch-assets/art/b-panel@2x.webp) 65 90 fill / 14px 18px;padding:24px;color:#382516;filter:drop-shadow(0 6px 5px #0007);margin:12px 0}.paper,.wood,.field{clip-path:polygon(1% 3%,24% 0,52% 1%,77% 0,99% 2%,100% 31%,99% 68%,100% 98%,74% 100%,49% 99%,25% 100%,0 98%,1% 65%,0 30%)}.wood{background:linear-gradient(#24130aad,#24130acd),url(witch-assets/wood-table.jpg) center/cover;color:#ffdda8;box-shadow:inset 0 2px #9f75455e,inset 0 -5px #100704a8,0 6px 8px #0008;padding:18px 24px;min-height:62px;margin:18px 0 8px;width:100%}.label{font-size:14px;color:#d9bd93}.field{padding:19px 22px;background:#ddc8a1 url(witch-assets/parchment.jpg) center/cover;color:#382516;margin:18px 0;font-size:18px}.option{display:block;width:100%;padding:16px 20px}.option[aria-pressed=true]{box-shadow:inset 0 0 0 4px #846139;color:#261807}.jar{width:66px;height:100px;object-fit:contain;filter:drop-shadow(0 7px 6px #050200)}.record{position:relative;padding:0 0 20px;margin:20px 0 34px}.record .jar{position:relative;z-index:2;margin-bottom:-8px}.record .paper{margin:0;position:relative;z-index:3}.shelf{position:absolute;height:24px;left:-12px;right:-12px;bottom:0;background:linear-gradient(#76523466,#24160ec9),url(witch-assets/wood-table.jpg) center/cover;box-shadow:0 8px 10px #0009,inset 0 -7px #291b13}.status{font-family:Fell;font-size:18px;color:#71431f;margin-top:9px}.hanging .paper{transform:rotate(-.6deg)}.hanging .paper:nth-of-type(even){transform:rotate(.7deg)}.cabinet .paper{border-image:none;background:#e0cda7 url(witch-assets/parchment.jpg) center/cover;padding:18px 22px}.cabinet .option{background:#d8bd8e}.ledger .page{padding:22px 18px;background:#e0cda7 url(witch-assets/parchment.jpg) center/cover;color:#382516;box-shadow:-7px 3px #382216,0 9px 18px #0009}.ledger .paper{background:none;border:0;border-image:none;filter:none;padding:12px 8px}.ledger .record{margin:10px 0}.ledger .jar,.ledger .shelf{display:none}.ledger .wood{background:#5a3923}.ledger .label{color:#654c31}.ledger .option{border-bottom:1px dotted #806342;background:none}.fine{font-size:14px;line-height:1.45}.selection{color:#f5ca85}.ledger .selection{color:#654324}
</style>
<header><h1>Apothecary · three material grammars</h1><p>Same room, different relationships between objects and actions.</p><nav aria-label="Study screen"></nav></header><main class="studies"></main>
<script>
const directions=[['hanging','Hanging labels','Ground familiar labels with attachments. Still repeats the same surface for every task.'],['cabinet','Working cabinet','Wood acts; paper receives ink; shelves hold memories. Strongest distinction between tasks.'],['ledger','Open ledger','One page quiets the room. Long forms feel more like a book than exploring an apothecary.']];let view=new URLSearchParams(location.search).get('view')||'history';
function record(title,date,status){return `<article class="record"><img class="jar" src="witch-assets/art/b-history-jar@2x.webp" alt=""><div class="paper"><p>${title}</p><p class="fine">${date}</p><p class="status">${status}</p></div><div class="shelf"></div></article>`}
function render(){document.querySelector('nav').innerHTML=['history','question','plans'].map(v=>`<button aria-pressed="${v===view}" onclick="view='${v}';render()">${v}</button>`).join('');document.querySelector('main').innerHTML=directions.map(([id,title,note])=>`<section class="study ${id}"><h2>${title}</h2><p class="note">${note}</p><div class="room"><h2>${view==='history'?'Bottled glimpses':view==='question'?'Your question.':'The cabinet'}</h2><div class="page">${view==='history'?record('A new conversation opens by spring.','Read October 3','Check back November 2')+record('Your next chapter begins close to home.','Read September 28','Came true'):view==='question'?`<p class="label">What lies ahead?</p><div class="${id==='hanging'?'paper':'field'}">Will I find my rhythm this winter?</div><p>What will help you begin?</p>${['A little practice','A class','My own words'].map((v,i)=>`<button class="paper option" aria-pressed="${i===0}" onclick="this.parentElement.querySelectorAll('.option').forEach(e=>e.setAttribute('aria-pressed','false'));this.setAttribute('aria-pressed','true')">${i===0?'✦ ':''}${v}</button>`).join('')}<button class="${id==='hanging'?'paper option':'wood'}">Reveal</button>`:`<p class="label">More glimpses</p>${['A week · $4.99','A month · $9.99','A year · $59.99'].map((v,i)=>`<button class="paper option" aria-pressed="${i===1}" onclick="this.parentElement.querySelectorAll('.option').forEach(e=>e.setAttribute('aria-pressed','false'));this.setAttribute('aria-pressed','true')">${v}</button>`).join('')}<p class="fine">Renews until canceled.</p><button class="${id==='hanging'?'paper option':'wood'}">Try monthly · demo</button><p class="fine">No charge. Visual study only.</p>`}</div></div></section>`).join('')};render();
</script></html>
